// ============================================================
function storageAvailable() {
  try { localStorage.setItem('_test', '1'); localStorage.removeItem('_test'); return true; }
  catch(e) { return false; }
}

function loadFromStorage() {
  if (!storageAvailable()) return false;
  try {
    const saved = localStorage.getItem('boa-crm-data');
    if (saved) {
      const data = JSON.parse(saved);
      state.companies = data.companies || [];
      state.contacts = data.contacts || [];
      state.interactions = data.interactions || [];
      state.projects = data.projects || [];
      state.meetings = data.meetings || [];
      state.relationships = data.relationships || [];
      state.lastUpdatedByClaudeCode = data.lastUpdatedByClaudeCode || null;
      state.lastUpdatedByUser = data.lastUpdatedByUser || null;
      updateStatus();
      return true;
    }
  } catch(e) { console.warn('loadFromStorage', e); }
  return false;
}

function saveToStorage() {
  if (!storageAvailable()) {
    console.warn('localStorage unavailable (probably opened via data: or in preview). Data will not persist until you connect to a file.');
    updateStatus();
    return;
  }
  try {
    state.lastUpdatedByUser = new Date().toISOString();
    localStorage.setItem('boa-crm-data', JSON.stringify({
      initialized:true, lastUpdatedByClaudeCode: state.lastUpdatedByClaudeCode, lastUpdatedByUser: state.lastUpdatedByUser, companies:state.companies, contacts:state.contacts, interactions:state.interactions, projects:state.projects
    }));
    updateStatus('saved');
  } catch(e) { console.warn('saveToStorage', e); }
}

// Unified save — uses file if connected, else localStorage
async function saveData() {
  if (fileHandle) await saveToFile();
  else saveToStorage();
}

    ts.innerHTML = `

function importJSON(event) {
  const input = event.target;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => alert('Error reading file: ' + reader.error);
  reader.onload = async (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err) {
      console.error('[importJSON] JSON parse failed:', err);
      alert('Invalid JSON: ' + err.message);
      return;
    }
    try {
      state.companies = Array.isArray(data.companies) ? data.companies : [];
      state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
      state.interactions = Array.isArray(data.interactions) ? data.interactions : [];
      state.projects = Array.isArray(data.projects) ? data.projects : [];
      state.meetings = Array.isArray(data.meetings) ? data.meetings : [];
    state.relationships = Array.isArray(data.relationships) ? data.relationships : [];
    } catch(err) {
      console.error('[importJSON] state assign failed:', err);
      alert('Unexpected JSON structure: ' + err.message);
      return;
    }
    try {
      await saveData();
    } catch(err) {
      console.error('[importJSON] save failed:', err);
      alert('Error saving: ' + err.message);
    }
    try {
      render();
    } catch(err) {
      console.error('[importJSON] render failed:', err);
      alert('Error rendering interface: ' + err.message + '\n\nCheck the console (F12).');
      return;
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function exportJSON() {
  const data = { initialized:true, companies:state.companies, contacts:state.contacts, interactions:state.interactions };
  const blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `boa-crm-export-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
}

function getSelfHtml() {
  // Clone the document so we don't mutate live UI
  const clone = document.documentElement.cloneNode(true);

  // Clear dynamic content in clone (will be re-rendered on load in the share file)
  ['dashboard','companies','contacts','interactions'].forEach(v => {
    const el = clone.querySelector('#view-' + v);
    if (el) el.innerHTML = '';
  });
  clone.querySelectorAll('[id^="badge-"]').forEach(el => el.textContent = '');
  const status = clone.querySelector('#data-status');
  if (status) status.innerHTML = '';

  // Reset modal state
  const modal = clone.querySelector('#modal-overlay');
  if (modal) modal.className = 'modal-overlay';

  // Remove dynamically-added banners or password gate from clone
  ['password-gate'].forEach(id => clone.querySelector('#'+id)?.remove());
  clone.querySelectorAll('body > div.fixed').forEach(el => el.remove());

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

async function buildShareHtml(encryptWithPassword) {
  // Try fetch first (works when served via http); fall back to DOM serialization (works on file://)
  let html;
  try {
    const res = await fetch(window.location.href, { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch not ok');
    html = await res.text();
  } catch(e) {
    html = getSelfHtml();
  }

  const data = { companies: state.companies, contacts: state.contacts, interactions: state.interactions, projects: state.projects, meetings: state.meetings, relationships: state.relationships, lastUpdatedByClaudeCode: state.lastUpdatedByClaudeCode, lastUpdatedByUser: state.lastUpdatedByUser };

  if (encryptWithPassword) {
    const encrypted = await encryptPayload(data, encryptWithPassword);
    const payload = JSON.stringify(encrypted).replace(/<\/script>/gi, '<\\/script>');
    html = html.replace(
      /const ENCRYPTED_DATA = null; \/\*__ENCRYPTED_DATA__\*\//,
      `const ENCRYPTED_DATA = ${payload}; /*__ENCRYPTED_DATA__*/`
    );
  } else {
    const payload = JSON.stringify(data).replace(/<\/script>/gi, '<\\/script>');
    html = html.replace(
      /const SHARED_DATA = null; \/\*__SHARED_DATA__\*\//,
      `const SHARED_DATA = ${payload}; /*__SHARED_DATA__*/`
    );
  }
  return html;
}

function utf8ToBase64(str) {
  // Handle UTF-8 properly (btoa fails on non-ASCII)
  return btoa(unescape(encodeURIComponent(str)));
}

async function publishToWeb() {
  const cfg = getPublishConfig();
  if (!cfg || !cfg.owner || !cfg.repo || !cfg.token || !cfg.viewerPassword) {
    openPublishSettings();
    return;
  }
  const btn = document.getElementById('btn-publish');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '<svg width="18" height="18" class="animate-spin" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-dasharray="40 60"/></svg> Publishing…';
  btn.style.pointerEvents = 'none';

  try {
    const html = await buildShareHtml(cfg.viewerPassword);
    const path = 'index.html';
    const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const headers = {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };

    // Get current SHA if file exists
    let sha = null;
    try {
      const existing = await fetch(apiUrl, { headers });
      if (existing.ok) {
        const j = await existing.json();
        sha = j.sha;
      }
    } catch(e) {}

    const body = {
      message: `Update CRM snapshot · ${new Date().toISOString()}`,
      content: utf8ToBase64(html),
      branch: cfg.branch || 'main'
    };
    if (sha) body.sha = sha;

    const resp = await fetch(apiUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify(body)
    });

    if (!resp.ok) {
      const errBody = await resp.text();
      throw new Error(`GitHub returned ${resp.status}: ${errBody.slice(0, 300)}`);
    }

    const publicUrl = `https://${cfg.owner}.github.io/${cfg.repo}/`;
    cfg.lastPublishedAt = new Date().toISOString();
    cfg.url = publicUrl;
    savePublishConfig(cfg);

    showPublishSuccess(publicUrl);
  } catch(err) {
    console.error('publishToWeb', err);
    alert('Publish failed:\n\n' + err.message + '\n\nCheck your token has "repo" scope and the repo exists.');
  } finally {
    btn.innerHTML = originalHtml;
    btn.style.pointerEvents = '';
  }
}

async function generateShareFile() {
  if (!state.companies.length && !state.contacts.length) {
    alert('No data to share yet.');
    return;
  }
  try {
    // Get the current HTML source (we need a copy of THIS file)
    const res = await fetch(window.location.href);
    let html = await res.text();
    // Inject the data
    const data = { companies: state.companies, contacts: state.contacts, interactions: state.interactions, projects: state.projects, meetings: state.meetings, relationships: state.relationships, lastUpdatedByClaudeCode: state.lastUpdatedByClaudeCode, lastUpdatedByUser: state.lastUpdatedByUser };
    const payload = JSON.stringify(data).replace(/<\/script>/gi, '<\\/script>');
    html = html.replace(
      /const SHARED_DATA = null; \/\*__SHARED_DATA__\*\//,
      `const SHARED_DATA = ${payload}; /*__SHARED_DATA__*/`
    );
    // Download
    const blob = new Blob([html], { type: 'text/html' });

function setView(view) {
  // Re-clicking the nav while already on the same view resets any open detail page (back to list).
  // Switching from another view to one with a detail id preserves the detail.
  if (state.currentView === view) {
    if (view === 'projects' && state.projectDetailId) state.projectDetailId = null;
    if (view === 'companies' && state.companyDetailId) state.companyDetailId = null;
  }
  state.currentView = view;
  ['dashboard','companies','contacts','interactions','projects'].forEach(v => {
    document.getElementById('view-'+v).classList.toggle('hidden', v !== view);
    document.getElementById('nav-'+v).classList.toggle('active', v === view);
  });
  render();
}

function render() {
  // Preserve focus + cursor of any focused input/textarea before innerHTML wipes it
  const active = document.activeElement;
  let focusId = null, cursorStart = null, cursorEnd = null;
  if (active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
    focusId = active.id;
    try { cursorStart = active.selectionStart; cursorEnd = active.selectionEnd; } catch(e) {}
  }

  if (state.currentView === 'dashboard') renderDashboard();
  else if (state.currentView === 'companies') renderCompanies();
  else if (state.currentView === 'contacts') renderContacts();
  else if (state.currentView === 'interactions') renderInteractions();
  else if (state.currentView === 'projects') renderProjects();

  // Restore focus to the same element by id, putting cursor back where it was
  if (focusId) {
    const newEl = document.getElementById(focusId);
    if (newEl) {
      newEl.focus();
      if (cursorStart != null && typeof newEl.setSelectionRange === 'function') {
        try { newEl.setSelectionRange(cursorStart, cursorEnd ?? cursorStart); } catch(e) {}
      }
    }
  }
}

// Compact 2-letter country code for the Companies/Contacts tables. Storage stays as
// the full country name; display uses the code via this lookup.
const COUNTRY_CODES = {
  'portugal':'PT','spain':'ES','españa':'ES','espanha':'ES','france':'FR','germany':'DE','italy':'IT','italia':'IT',
  'united kingdom':'UK','uk':'UK','great britain':'UK','england':'UK','scotland':'UK',
  'united states':'US','usa':'US','us':'US','united states of america':'US',
  'switzerland':'CH','suíça':'CH','suica':'CH','netherlands':'NL','holland':'NL','belgium':'BE','luxembourg':'LU','luxemburgo':'LU',
  'austria':'AT','ireland':'IE','greece':'GR','grécia':'GR','grecia':'GR',
  'sweden':'SE','denmark':'DK','norway':'NO','finland':'FI','poland':'PL','romania':'RO','czechia':'CZ','czech republic':'CZ',
  'brazil':'BR','brasil':'BR','mexico':'MX','méxico':'MX','argentina':'AR','chile':'CL','colombia':'CO','peru':'PE','venezuela':'VE','uruguay':'UY','panama':'PA','panamá':'PA',
  'singapore':'SG','japan':'JP','china':'CN','hong kong':'HK','south korea':'KR','korea':'KR',
  'india':'IN','indonesia':'ID','thailand':'TH','vietnam':'VN','malaysia':'MY',
  'australia':'AU','new zealand':'NZ','canada':'CA','south africa':'ZA',
  'morocco':'MA','marrocos':'MA','egypt':'EG','israel':'IL','turkey':'TR','türkiye':'TR',
  'uae':'AE','united arab emirates':'AE','emiratos':'AE','saudi arabia':'SA','arábia saudita':'SA','qatar':'QA','kuwait':'KW','bahrain':'BH','oman':'OM','lebanon':'LB','jordan':'JO',
  'germany / usa':'DE/US','andorra':'AD','iceland':'IS','monaco':'MC','liechtenstein':'LI'
};
function countryCode(c) {
  if (!c) return '';
  const t = String(c).trim();
  if (!t) return '';
  const k = t.toLowerCase();
  if (COUNTRY_CODES[k]) return COUNTRY_CODES[k];
  // Already short (≤4 chars like 'PT', 'UK', 'DE/US'): keep as-is
  if (t.length <= 4) return t.toUpperCase();
  // Unknown country: take first letters of each word capitalised
  return t.split(/[\s/]+/).map(w => w[0]||'').join('').slice(0,4).toUpperCase();
}

// Three-tier status (Active / Watching / Not Active). statusOverride always wins.
// A status only counts off a REAL interaction = an email actually sent by me, a reply from them,
// or a real call/meeting. A draft (not yet sent) or a "flagged/no-email" placeholder does NOT count.
// Rules:
//  • NOT ACTIVE : no real interaction at all (incl. only-a-draft); OR 'not_interested' (no project); OR 'closed';
//                 OR a cooling (monitoring) lead silent longer than DEAD_DAYS.
//  • ACTIVE     : latest real KPI = 'in_conversation' (they replied / emailed) AND last touch ≤ STALE_DAYS.
//  • WATCHING   : I've sent something but no live two-way deal — 'info_sent' (sent, awaiting),
//                 'action_required' (chasing after no reply), 'monitoring' (cooling);
//                 OR 'not_interested' tied to a specific project; OR an 'in_conversation' gone quiet.
const STALE_DAYS = 35;   // an active conversation silent this long → Watching
const DEAD_DAYS  = 45;   // a cooling (monitoring) lead silent this long → Not Active
// A real interaction = an email/call/WhatsApp/LinkedIn that actually happened.
// Drafts, placeholders, business-card collections, and "identified/flagged" notes DO NOT count.
function isContactInteraction(i){
  const s = i.subject || '';
  if (s.includes('(DRAFT') || s.includes('(no email)') || s.includes('Status set inline')) return false;
  if (/^(Card collected|Met |Identified at|Identified |Internal flag|Cold lead|Stale —)/.test(s)) return false;
  return true;
}
function getStatus(co) {
  if (co.statusOverride === 'active' || co.statusOverride === 'watching' || co.statusOverride === 'inactive') return co.statusOverride;
  const list = state.interactions.filter(i => i.companyId === co.id && isContactInteraction(i));
  if (!list.length) return 'inactive';   // no real (sent) interaction → Not Active
  const latest = list.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
  const days = latest.date ? Math.floor((Date.now() - new Date(latest.date).getTime()) / 86400000) : 9999;
  if (INACTIVE_KPIS.has(latest.kpi)) {
    if (latest.kpi === 'not_interested' && Array.isArray(latest.projectIds) && latest.projectIds.length > 0) return 'watching';
    return 'inactive';
  }
  if (latest.kpi === 'in_conversation') return days > STALE_DAYS ? 'watching' : 'active';  // they engaged
  if (latest.kpi === 'monitoring')      return days > DEAD_DAYS  ? 'inactive' : 'watching'; // cooling → eventually dead
  return 'watching';   // info_sent / action_required = reached out / chasing, no reply yet
}
// Legacy alias — returns Active/Inactive (used to return hot/warm/cold/not_interested)
function getTemperature(co) { return getStatus(co); }

function fmtDate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); } catch(e){ return iso; } }
function fmtDateShort(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); } catch(e){ return iso; } }
function relTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso); const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)} min ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)} h ago`;
  if (diff < 604800) return `${Math.floor(diff/86400)} d ago`;
  return fmtDate(iso);
}

function getInitials(name) {
  return (name||'?').split(/\s+/).slice(0,2).map(w => w[0]||'').join('').toUpperCase();
}

const AVATAR_COLORS = ['#233b34','#2d4a42','#3a5a4e','#4a5c4a','#5a6650','#6b6850','#8f7a55','#aca497','#5c4a3a','#3a443a'];
function avatarColor(s) {
  let h=0; for(const c of (s||'')) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

          const monday = new Date(todayDate); monday.setDate(monday.getDate() - dayOfWeek + 1);
          for (let w = 11; w >= 0; w--) {
            const start = new Date(monday); start.setDate(monday.getDate() - w*7);
            const end = new Date(start); end.setDate(start.getDate() + 7);
            const count = state.interactions.filter(i => {
              if (!i.date) return false;
              const d = new Date(i.date);
              return d >= start && d < end;
            }).length;
            weeks.push({ start, count });
          }
          const maxW = Math.max(1, ...weeks.map(w => w.count));
          const thisWeekCount = weeks[weeks.length-1].count;
          const lastWeekCount = weeks[weeks.length-2]?.count || 0;
          const delta = lastWeekCount ? Math.round(((thisWeekCount - lastWeekCount) / lastWeekCount) * 100) : null;
          return `<div class="card p-6">
            <div class="flex items-center justify-between mb-5">
              <h2 class="font-display text-xl font-medium">Weekly Activity</h2>
              <div class="text-xs num" style="color: var(--warm);">
                <span class="font-semibold" style="color: var(--ink);">${thisWeekCount}</span> this week
                ${delta != null ? `<span style="color:${delta >= 0 ? 'var(--green)' : '#a04330'};margin-left:6px;">${delta >= 0 ? '+' : ''}${delta}%</span>` : ''}
              </div>
            </div>
            <div class="flex items-stretch gap-1.5" style="height: 110px;">
              ${weeks.map((w, idx) => {
                const h = Math.round((w.count / maxW) * 100);
                const isCurrent = idx === weeks.length - 1;
                const color = isCurrent ? 'var(--green)' : 'var(--warm)';
                const opacity = isCurrent ? '1' : '0.55';
                return `<div class="flex-1 flex flex-col items-center justify-end" style="height:100%;" title="Week of ${fmtDateShort(w.start.toISOString())} — ${w.count} interactions">
                  <div class="w-full rounded-sm transition-all" style="height: ${Math.max(h, 4)}%; background: ${color}; opacity: ${opacity};"></div>
                </div>`;
              }).join('')}
            </div>
            <div class="flex justify-between mt-3 text-[10px] num" style="color: var(--warm);">
              <span>12w ago</span>
              <span>this week</span>
            </div>
          </div>`;
        })()}
      </div>

      `}
      `}
    </div>
  `;
}

// Newsletter sync to Google Drive — POSTs Name/Company/Email to a Google Apps Script Web App
// that writes/updates a Google Sheet. URL is configured once via window.prompt (stored in
// localStorage). Shift-click the button to reset the URL.
async function syncNewsletterToDrive(ev){
  if (ev && ev.shiftKey) { localStorage.removeItem('boa-crm-drive-sync'); alert('Drive URL cleared. The next click will ask for the new URL.'); return; }
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem('boa-crm-drive-sync')||'null'); } catch(e){}
  if (!cfg || !cfg.webAppUrl) {
    const u = window.prompt('Paste your Google Apps Script Web App URL (ends with /exec):', '');
    if (!u) return;
    if (!u.includes('/exec')) { alert('That URL does not look like a Web App URL — it must end with /exec.\nGo back to Apps Script → Deploy → Web app, copy the URL and try again.'); return; }
    cfg = { webAppUrl: u.trim() };
    localStorage.setItem('boa-crm-drive-sync', JSON.stringify(cfg));
  }
  const rows = [['Name','Company','Email']];
  state.contacts.forEach(p => {
    if (!p.email || !p.email.trim()) return;
    const co = state.companies.find(c => c.id === p.companyId);
    const name = ((p.firstName||'') + ' ' + (p.lastName||'')).trim();
    rows.push([name, co?co.name:'', p.email.trim()]);
  });
  if (rows.length === 1) { alert('No contacts with email to sync.'); return; }
  const payload = JSON.stringify({ rows });
  // Apps Script returns a 302 redirect that often strips CORS headers — try cors first, fall back to no-cors
  // (the POST still reaches the script; we just can't read the response in that mode).
  try {
    const resp = await fetch(cfg.webAppUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: payload });
    const txt = await resp.text();
    let j = null; try { j = JSON.parse(txt); } catch(e){}
    if (j && j.ok) {
      const open = confirm(`Synced ${j.rows} contacts to Google Drive ✓\n\nOpen the Sheet now?`);
      if (open && j.url) window.open(j.url, '_blank');
      return;
    }
    alert('Sync sent but the response was unexpected:\n' + (txt || '(empty)') + '\n\nCheck the "BOA Newsletter Contacts" Sheet in your Drive to confirm.');
  } catch(err) {
    try {
      await fetch(cfg.webAppUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: payload, mode:'no-cors' });
      alert('Sync sent to Google Drive ✓\n\n(Browser blocked reading the response for CORS reasons, but the data WAS sent to Apps Script. Open the "BOA Newsletter Contacts" Sheet in your Drive to verify.)');
    } catch(err2) {
      alert('Sync error: ' + err2.message + '\n\nChecklist:\n• URL ends with /exec\n• Apps Script deployed as Web App with "Anyone" access\n• Opening the URL in a browser tab shows the plain-text endpoint message\n\nShift+click the button to reset the saved URL.');
    }
  }
}

// Newsletter export — downloads a CSV (Name / Company / Email) for every contact that has an email.
// CSV uses UTF-8 BOM + semicolon separator so Excel (PT/ES locale) opens it cleanly with accents.
function exportNewsletterCsv(){
  const rows = [['Name','Company','Email']];
  state.contacts.forEach(p => {
    if (!p.email || !p.email.trim()) return;
    const co = state.companies.find(c => c.id === p.companyId);
    const name = ((p.firstName||'') + ' ' + (p.lastName||'')).trim();
    rows.push([name, co?co.name:'', p.email.trim()]);
  });
  if (rows.length === 1) { alert('No contacts with email to export.'); return; }
  const csv = '﻿' + rows.map(r => r.map(v => {
    const s = String(v).replace(/"/g,'""');
    return /[;\n"\r]/.test(s) ? `"${s}"` : s;
  }).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `boa-newsletter-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function renderCompanies() {
  // Route to detail page if a company is selected
  if (state.companyDetailId) {
    const co = state.companies.find(x => x.id === state.companyDetailId);
    if (!co) { state.companyDetailId = null; }
    else { renderCompanyDetail(co); return; }
  }

  const f = state.companyFilter;
  const filtered = state.companies.filter(c => {
    if (f.search) {
      const s = f.search.toLowerCase();
      if (!(c.name||'').toLowerCase().includes(s) && !(c.country||'').toLowerCase().includes(s)) return false;
    }
    if (f.category && c.category !== f.category) return false;
    if (f.type && c.type !== f.type) return false;
    if (f.temp && getTemperature(c) !== f.temp) return false;
    if (f.projectId) {
      const directHas = Array.isArray(c.projectIds) && c.projectIds.includes(f.projectId);
      const cInts = state.interactions.filter(i => i.companyId === c.id);
      const intHas = cInts.some(i => Array.isArray(i.projectIds) && i.projectIds.includes(f.projectId));
      if (!directHas && !intHas) return false;
    }
    return true;
  });
  // Sort: Active first → Watching → Not Active; within each tier, by latest interaction
  // date (most recent first). Companies with no interactions fall to the bottom of their
  // status tier (alphabetical among themselves).
  const _lastTouchCache = new Map();
  const lastTouchTs = (c) => {
    if (_lastTouchCache.has(c.id)) return _lastTouchCache.get(c.id);
    const cInts = state.interactions.filter(i => i.companyId === c.id);
    let ts = 0;
    for (const i of cInts) {
      const t = i.date ? new Date(i.date).getTime() : 0;
      if (t > ts) ts = t;
    }
    _lastTouchCache.set(c.id, ts);
    return ts;
  };
  const STATUS_ORDER = { active: 0, watching: 1, inactive: 2 };
  // Within a status group, order by KPI priority (most actionable first), then by most recent interaction.
  const KPI_ORDER = { action_required:0, in_conversation:1, info_sent:2, monitoring:3, not_interested:4, closed:5, won:5 };
  const kpiRank = (c) => {
    // Use the SAME "latest KPI" shown in the table column (latest of all interactions) so the
    // on-screen order matches the visible KPI within each status group.
    const ints = state.interactions.filter(i => i.companyId === c.id);
    if (!ints.length) return 9;
    const latest = ints.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
    return KPI_ORDER[latest.kpi] ?? 8;
  };
  filtered.sort((a, b) => {
    const sa = STATUS_ORDER[getStatus(a)] ?? 3;
    const sb = STATUS_ORDER[getStatus(b)] ?? 3;
    if (sa !== sb) return sa - sb;
    const ka = kpiRank(a), kb = kpiRank(b);
    if (ka !== kb) return ka - kb;            // then by KPI priority
    const ta = lastTouchTs(a), tb = lastTouchTs(b);
    if (ta === 0 && tb === 0) return (a.name||'').localeCompare(b.name||'');
    if (ta === 0) return 1;
    if (tb === 0) return -1;
    return tb - ta;                            // then most recent interaction first
  });
  const cats = [...new Set(state.companies.map(c => c.category).filter(Boolean))].sort();

  document.getElementById('view-companies').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-end justify-between mb-8">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">Directory</div>
          <h1 class="font-display text-4xl font-semibold tracking-tight">Companies <span class="text-slate-300 num">${filtered.length}</span></h1>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="syncNewsletterToDrive(event)" class="ghost-btn px-4 py-2.5 text-sm rounded-lg font-semibold inline-flex items-center gap-2" title="Push Name / Company / Email of all contacts with email to your Google Drive (creates/updates a Sheet). Shift+click to change the URL.">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.9 5 5 0 019.9-1A5.5 5.5 0 0118.5 16h-1M12 12v9m-3-3l3 3 3-3"/></svg>
            Sync to Drive
          </button>
          <button onclick="openNewModal('company')" class="gold-btn px-4 py-2.5 text-sm rounded-lg font-semibold shadow-sm inline-flex items-center gap-2">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            New Company
          </button>
        </div>
      </div>

      <div class="card p-4 mb-4 flex flex-wrap gap-2">
        <div class="relative flex-1 min-w-64">
          <svg class="absolute left-3 top-2.5 text-slate-400" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="search-companies" type="text" placeholder="Search company…" value="${esc(f.search)}"
            oninput="state.companyFilter.search=this.value; render()"
            class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
        </div>
        <select onchange="state.companyFilter.category=this.value; renderCompanies()" class="px-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
          <option value="">All categories</option>
          ${cats.map(c => `<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
        <select onchange="state.companyFilter.type=this.value; renderCompanies()" class="px-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
          <option value="">All types</option>
          <option value="investor" ${f.type==='investor'?'selected':''}>Investor</option>

// ============================================================
//  INTERACTIONS VIEW
// ============================================================
function renderInteractions() {
  const f = state.interactionFilter;
  const filtered = state.interactions.filter(i => {
    if (f.search) {
      const s = f.search.toLowerCase();
      if (!(i.subject||'').toLowerCase().includes(s) && !(i.summary||'').toLowerCase().includes(s)) return false;
    }
    if (f.kpi && i.kpi !== f.kpi) return false;
    if (f.companyId && i.companyId !== f.companyId) return false;
    if (f.projectId && !(Array.isArray(i.projectIds) && i.projectIds.includes(f.projectId))) return false;
    return true;
  });

  // Group by company
  const groups = new Map();
  for (const i of filtered) {
    const key = i.companyId || '__none__';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  // Sort interactions within each group by date desc, and sort groups by most recent interaction
  const groupList = [];
  for (const [companyId, items] of groups.entries()) {
    items.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    const latestDate = items[0]?.date || 0;
    groupList.push({ companyId, items, latestDate });
  }
  groupList.sort((a,b) => new Date(b.latestDate||0) - new Date(a.latestDate||0));

  document.getElementById('view-interactions').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-end justify-between mb-8">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">By Company</div>
          <h1 class="font-display text-4xl font-semibold tracking-tight">Interactions <span class="text-slate-300 num">${filtered.length}</span> <span class="text-sm font-normal" style="color: var(--warm);">· ${groupList.length} companies</span></h1>
        </div>
        <button onclick="openNewModal('interaction')" class="gold-btn px-4 py-2.5 text-sm rounded-lg font-semibold shadow-sm inline-flex items-center gap-2">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          New Interaction
        </button>
      </div>

      <div class="card p-4 mb-4 flex flex-wrap gap-2">
        <div class="relative flex-1 min-w-64">
          <svg class="absolute left-3 top-2.5 text-slate-400" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="search-interactions" type="text" placeholder="Search by subject or summary…" value="${esc(f.search)}"
            oninput="state.interactionFilter.search=this.value; render()"
            class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
        </div>
        <select onchange="state.interactionFilter.kpi=this.value; renderInteractions()" class="px-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
          <option value="">All KPIs</option>
          <option value="action_required" ${f.kpi==='action_required'?'selected':''}>Action Required</option>
          <option value="info_sent" ${f.kpi==='info_sent'?'selected':''}>Info Sent</option>
          <option value="in_conversation" ${f.kpi==='in_conversation'?'selected':''}>In Conversation</option>
          <option value="monitoring" ${f.kpi==='monitoring'?'selected':''}>Monitoring</option>
          <option value="not_interested" ${f.kpi==='not_interested'?'selected':''}>Not Interested</option>
        </select>
        <select onchange="state.interactionFilter.companyId=this.value; renderInteractions()" class="px-3 py-2 border rounded-lg text-sm max-w-xs" style="border-color: var(--line);">
          <option value="">All companies</option>
          ${state.companies.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c => `<option value="${esc(c.id)}" ${f.companyId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
        <select onchange="state.interactionFilter.projectId=this.value; renderInteractions()" class="px-3 py-2 border rounded-lg text-sm max-w-xs" style="border-color: var(--line);">
          <option value="">All projects</option>
          ${state.projects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p => `<option value="${esc(p.id)}" ${f.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>

      ${filtered.length === 0
        ? `<div class="card p-16 text-center text-slate-400">No interactions found</div>`
        : `<div class="space-y-4">
            ${groupList.map(g => {
              const co = state.companies.find(c => c.id === g.companyId);
              const coName = co ? co.name : '— No company —';
              const temp = co ? getTemperature(co) : null;
              const coCountry = co ? (co.country || '') : '';
              const coType = co ? (typeLabel(co)) : '';
              return `<div class="card overflow-hidden">
                <div class="px-5 py-4 flex items-center gap-3 border-b" style="border-color: var(--line-soft); background: var(--paper-soft);">
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center text-white text-xs font-semibold flex-shrink-0" style="background:${avatarColor(coName)};">${getInitials(coName)}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      ${co ? `<a onclick="event.stopPropagation();openEditModal('company','${esc(co.id)}')" class="font-display text-lg font-medium cursor-pointer hover:underline" style="color: var(--ink);">${esc(coName)}</a>` : `<span class="font-display text-lg font-medium" style="color: var(--warm);">${esc(coName)}</span>`}
                      ${temp ? pill(TEMP, temp) : ''}
                    </div>
                    <div class="text-xs mt-0.5" style="color: var(--warm);">
                      ${coCountry ? esc(coCountry) + ' · ' : ''}${coType ? esc(coType) + ' · ' : ''}${g.items.length} interaction${g.items.length>1?'s':''} · latest ${fmtDate(g.latestDate)}
                    </div>
                  </div>
                </div>
                <div class="divide-y" style="--tw-divide-opacity:1;">
                  ${g.items.map(i => {
                    const ct = state.contacts.find(c => c.id === i.contactId);
                    const projectTags = Array.isArray(i.projectIds) ? i.projectIds.map(pid => state.projects.find(p => p.id === pid)).filter(Boolean) : [];
                    const expanded = isInlineEditing('interaction', i.id);
                    return `<div class="flex items-start gap-4 px-5 py-3.5 row-hover cursor-pointer ${expanded?'bg-[var(--paper-soft)]':''}" onclick="openEditInline('interaction','${esc(i.id)}')">
                      <svg class="flex-shrink-0 mt-1" width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="color: var(--warm); transform: rotate(${expanded?90:0}deg); transition: transform 0.15s;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1 flex-wrap" onclick="event.stopPropagation()">
                          <span class="font-medium text-sm" style="color: var(--ink); cursor: pointer;" onclick="openEditInline('interaction','${esc(i.id)}')">${esc(i.subject || '—')}</span>
                          ${i.kind ? `<span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded" style="background: var(--paper); color: var(--warm);">${esc(i.kind)}</span>` : ''}
                          ${(() => {
                            const kCol = KPI[i.kpi] || KPI.in_conversation;
                            return `<select onchange="updateInteractionKpi('${esc(i.id)}', this.value)" class="pill-select" style="background-color:${kCol.bg}; color:${kCol.fg}; border:1px solid ${kCol.d}33;">
                              <option value="action_required" ${i.kpi==='action_required'?'selected':''}>Action Required</option>
                              <option value="info_sent" ${i.kpi==='info_sent'?'selected':''}>Info Sent</option>
                              <option value="in_conversation" ${i.kpi==='in_conversation'?'selected':''}>In Conversation</option>
                              <option value="monitoring" ${i.kpi==='monitoring'?'selected':''}>Monitoring</option>
                              <option value="not_interested" ${i.kpi==='not_interested'?'selected':''}>Not Interested</option>
                            </select>`;
                          })()}
                          ${projectTags.map(p => `<span class="text-[10px] px-1.5 py-0.5 rounded font-medium" style="background: rgba(35,59,52,0.08); color: var(--green); border: 1px solid rgba(35,59,52,0.15);">${esc(p.name)}</span>`).join('')}
                          ${i.completed ? `<span class="text-xs" style="color: var(--green);">✓</span>` : ''}
                        </div>
                        ${i.summary ? `<div class="text-sm text-slate-600 line-clamp-2">${esc(i.summary)}</div>` : ''}
                        <div class="text-xs text-slate-400 mt-1.5 flex items-center gap-3 flex-wrap">
                          ${ct ? `<span>${esc(ct.firstName+' '+ct.lastName)}</span>` : ''}
                          ${i.followUpDate ? `<span style="color: #7a5c3c;">↻ Follow-up on ${fmtDate(i.followUpDate)}</span>` : ''}
                        </div>
                      </div>
                      <div class="text-xs num text-right flex-shrink-0" style="color: var(--warm);">
                        <div style="color: var(--ink);">${fmtDateShort(i.date)}</div>
                        <div class="mt-0.5">${relTime(i.date)}</div>
                      </div>
                    </div>
                    ${expanded ? renderInlineEditForm('interaction', i, { title: i.subject || '—' }) : ''}`;
                  }).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>`}
    </div>
  `;
}

// ============================================================
//  PROJECTS VIEW
// ============================================================
const PROJECT_STATUS = {
  active:     { label:'Active',     bg:'rgba(35,59,52,0.08)',   fg:'#233b34', d:'#233b34' },
  not_active: { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' },
  // Legacy aliases so old data still renders during migration
  on_hold:    { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' },
  won:        { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' },
  lost:       { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' }
};

function projectStats(p) {
  const ints = state.interactions.filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(p.id));
  const companyIds = [...new Set(ints.map(i => i.companyId).filter(Boolean))];
  const latest = ints.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
  const pending = ints.filter(i => i.kpi === 'action_required' && !i.completed).length;
  return { interactions: ints, companyIds, latest, pending };
}

function fmtEUR(n) {
  if (n == null || n === '') return '—';
  if (n >= 1000000) return '€' + (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1000) return '€' + (n/1000).toFixed(0) + 'k';
  return '€' + n;
}

function openProjectDetail(id) {
  state.projectDetailId = id;
  renderProjects();
}
function closeProjectDetail() {
  state.projectDetailId = null;
  renderProjects();
}

function renderProjectDetail(p) {
  // Gather all interactions for this project
  const ints = state.interactions
    .filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(p.id))
    .sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

  // Group by company
  const byCompany = new Map();
  for (const i of ints) {
    const key = i.companyId || '__none__';
    if (!byCompany.has(key)) byCompany.set(key, []);
    byCompany.get(key).push(i);
  }

  // Build company rows
  const companyRows = [];
  for (const [companyId, items] of byCompany.entries()) {
    const co = state.companies.find(c => c.id === companyId);
    const latest = items[0];
    companyRows.push({ co, companyId, latest, count: items.length });
  }
  companyRows.sort((a,b) => new Date(b.latest.date||0) - new Date(a.latest.date||0));

  // Action items (action_required + overdue follow-ups)
  const todayDate = new Date(); todayDate.setHours(0,0,0,0);
  const pending = ints.filter(i =>
    (i.kpi === 'action_required' && !i.completed) ||
    (i.followUpDate && new Date(i.followUpDate) < todayDate && !i.completed)
  );

  // Stats
  const latestDate = ints[0]?.date;
  const daysSinceLatest = latestDate ? Math.floor((todayDate - new Date(latestDate)) / (1000*60*60*24)) : null;
  const status = p.status || 'active';

  document.getElementById('view-projects').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <!-- Back -->
      <button onclick="closeProjectDetail()" class="text-xs uppercase tracking-wider font-semibold mb-4 inline-flex items-center gap-1.5 hover:opacity-70" style="color: var(--warm);">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back to projects
      </button>

      <!-- Header -->
      <div class="flex items-start justify-between mb-2">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">Project</div>
          <div class="flex items-center gap-3 flex-wrap">
            <h1 class="font-display text-4xl font-semibold tracking-tight">${esc(p.name)}</h1>
            ${pill(PROJECT_STATUS, status)}
          </div>
          <div class="text-sm mt-2" style="color: var(--warm);">
            ${p.location ? esc(p.location) + ' · ' : ''}${p.type ? esc(p.type) + ' · ' : ''}${p.keys ? p.keys + ' keys · ' : ''}${fmtEUR(p.targetAmount)}
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="openEditInline('project','${esc(p.id)}')" class="ghost-btn px-4 py-2 text-sm rounded-lg font-medium">${isInlineEditing('project', p.id) ? 'Close edit' : 'Edit'}</button>
          <button onclick="openNewModal('interaction')" class="gold-btn px-4 py-2 text-sm rounded-lg font-semibold inline-flex items-center gap-2">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Log Interaction
          </button>
        </div>
      </div>

      ${isInlineEditing('project', p.id) ? `<div class="card overflow-hidden mt-4 mb-2" style="border-color: var(--line);">${renderInlineEditForm('project', p, { title: p.name })}</div>` : ''}

      <!-- Stats row -->
      <div class="grid grid-cols-4 gap-4 mb-6 mt-6">
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Companies</div>
          <div class="font-display text-3xl font-medium num">${companyRows.length}</div>
        </div>
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Interactions</div>
          <div class="font-display text-3xl font-medium num">${ints.length}</div>
        </div>
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Pending</div>
          <div class="font-display text-3xl font-medium num" style="color: ${pending.length > 0 ? '#a04330' : 'var(--ink)'};">${pending.length}</div>
        </div>
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Last activity</div>
          <div class="font-display text-xl font-medium">${latestDate ? fmtDate(latestDate) : '—'}</div>
          ${daysSinceLatest !== null ? `<div class="text-xs mt-1" style="color: var(--warm);">${daysSinceLatest}d ago</div>` : ''}
        </div>
      </div>

      <!-- Description / History -->
      ${p.description || p.history ? `
      <div class="card p-6 mb-6">
        ${p.description ? `<div class="mb-4">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Description</div>
          <div class="text-sm leading-relaxed" style="color: var(--ink);">${esc(p.description)}</div>
        </div>` : ''}
        ${p.history ? `<div>
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">History</div>
          <div class="text-sm leading-relaxed" style="color: var(--ink); opacity: 0.85;">${esc(p.history)}</div>
        </div>` : ''}
      </div>
      ` : ''}

      <!-- Pending action items -->
      ${pending.length > 0 ? `
      <div class="card p-5 mb-6" style="border-left: 3px solid #b04c32;">
        <h2 class="font-display text-lg font-medium mb-3 flex items-center gap-2">
          <span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:#b04c32;"></span>
          Pending action items <span class="text-sm font-normal" style="color: var(--warm);">(${pending.length})</span>
        </h2>
        <div class="space-y-2">
          ${pending.map(i => {
            const co = state.companies.find(c => c.id === i.companyId);
            const isOverdue = i.followUpDate && new Date(i.followUpDate) < todayDate;
            return `<div class="flex items-start gap-3 py-2 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="openEditModal('interaction','${esc(i.id)}')">
              <div class="w-8 h-8 rounded flex items-center justify-center text-white text-[10px] font-semibold flex-shrink-0" style="background:${avatarColor(co?co.name:'')};">${getInitials(co?co.name:'?')}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-medium text-sm" style="color: var(--ink);">${esc(co?co.name:'—')}</span>
                  <span class="text-xs" style="color: var(--warm);">·</span>
                  <span class="text-sm" style="color: var(--ink);">${esc(i.subject || '')}</span>
                </div>
                <div class="text-[11px] num mt-0.5" style="color: ${isOverdue ? '#a04330' : 'var(--warm)'};">
                  ${isOverdue ? '⚠ Overdue · was ' : 'Due '}${fmtDate(i.followUpDate || i.date)}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      ` : ''}

      <!-- Companies engaged -->
      <div class="card p-5 mb-6">
        <h2 class="font-display text-lg font-medium mb-3">Companies engaged <span class="text-sm font-normal" style="color: var(--warm);">(${companyRows.length})</span></h2>
        ${companyRows.length === 0
          ? `<div class="text-sm py-4 text-center" style="color: var(--warm);">No companies engaged yet on this project</div>`
          : `<div class="divide-y" style="border-color: var(--line-soft);">
              ${companyRows.map(({co, latest, count}) => {
                if (!co) return '';
                const temp = getTemperature(co);
                return `<div class="flex items-start gap-3 py-3 row-hover cursor-pointer px-2 -mx-2 rounded" onclick="event.stopPropagation();openEditModal('company','${esc(co.id)}')">
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center text-white text-xs font-semibold flex-shrink-0" style="background:${avatarColor(co.name)};">${getInitials(co.name)}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap mb-1">
                      <span class="font-semibold text-sm" style="color: var(--ink);">${esc(co.name)}</span>
                      ${pill(TEMP, temp)}
                      <span class="text-[10px] px-1.5 py-0.5 rounded" style="background: var(--paper); color: var(--warm);">${typeLabel(co)}</span>
                    </div>
                    <div class="text-xs truncate" style="color: var(--warm);">${esc(latest.subject || '')}</div>
                  </div>
                  <div class="text-right text-xs flex-shrink-0">
                    ${pill(KPI, latest.kpi)}
                    <div class="num mt-1" style="color: var(--warm);">${fmtDateShort(latest.date)} · ${count} int</div>
                  </div>
                </div>`;
              }).join('')}
            </div>`}
      </div>

      <!-- Timeline -->
      <div class="card p-5">
        <h2 class="font-display text-lg font-medium mb-3">Timeline <span class="text-sm font-normal" style="color: var(--warm);">(${ints.length})</span></h2>
        ${ints.length === 0
          ? `<div class="text-sm py-4 text-center" style="color: var(--warm);">No interactions logged for this project yet</div>`
          : `<div class="divide-y" style="border-color: var(--line-soft);">
              ${ints.map(i => {
                const co = state.companies.find(c => c.id === i.companyId);
                const ct = state.contacts.find(c => c.id === i.contactId);
                return `<div class="flex items-start gap-4 px-2 -mx-2 py-3 row-hover cursor-pointer rounded" onclick="openEditModal('interaction','${esc(i.id)}')">
                  <div class="text-right num text-xs flex-shrink-0" style="color: var(--warm); width: 70px;">
                    <div style="color: var(--ink); font-weight: 500;">${fmtDateShort(i.date)}</div>
                    <div class="mt-0.5">${relTime(i.date)}</div>
                  </div>
                  <div class="flex-1 min-w-0 border-l pl-4" style="border-color: var(--line-soft);">
                    <div class="flex items-center gap-2 flex-wrap mb-0.5">
                      <span class="font-semibold text-sm" style="color: var(--ink);">${esc(co?co.name:'—')}</span>
                      ${i.kind ? `<span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded" style="background: var(--paper); color: var(--warm);">${esc(i.kind)}</span>` : ''}
                      ${pill(KPI, i.kpi)}
                      ${i.completed ? `<span class="text-xs" style="color: var(--green);">✓</span>` : ''}
                    </div>
                    <div class="font-medium text-sm mb-1" style="color: var(--ink);">${esc(i.subject || '')}</div>
                    ${i.summary ? `<div class="text-sm line-clamp-2" style="color: var(--ink); opacity: 0.7;">${esc(i.summary)}</div>` : ''}
                    ${ct || i.followUpDate ? `<div class="text-xs mt-1 flex items-center gap-3 flex-wrap" style="color: var(--warm);">
                      ${ct ? `<span>${esc(ct.firstName+' '+ct.lastName)}</span>` : ''}
                      ${i.followUpDate ? `<span style="color: #7a5c3c;">↻ Follow-up on ${fmtDate(i.followUpDate)}</span>` : ''}
                    </div>` : ''}
                  </div>
                </div>`;
              }).join('')}
            </div>`}
      </div>

      <div class="text-center mt-6 mb-4">
        <button onclick="closeProjectDetail()" class="ghost-btn px-4 py-2 text-sm rounded-lg font-medium">← Back to projects</button>
      </div>
    </div>
  `;
}

function renderProjects() {
  // Route to detail page if a project is selected
  if (state.projectDetailId) {
    const p = state.projects.find(x => x.id === state.projectDetailId);
    if (!p) { state.projectDetailId = null; }
    else { renderProjectDetail(p); return; }
  }

  const f = state.projectFilter;
  const filtered = state.projects.filter(p => {
    if (f.search && !p.name.toLowerCase().includes(f.search.toLowerCase()) &&
        !(p.location||'').toLowerCase().includes(f.search.toLowerCase())) return false;
    if (f.status) {
      const ps = p.status || 'active';
      const normalized = (ps === 'on_hold' || ps === 'won' || ps === 'lost') ? 'not_active' : ps;
      if (normalized !== f.status) return false;
    }
    return true;
  });

  document.getElementById('view-projects').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-end justify-between mb-8">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">Pipeline</div>
          <h1 class="font-display text-4xl font-semibold tracking-tight">Projects <span class="text-slate-300 num">${filtered.length}</span></h1>
        </div>
        <button onclick="openNewModal('project')" class="gold-btn px-4 py-2.5 text-sm rounded-lg font-semibold shadow-sm inline-flex items-center gap-2">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          New Project
        </button>
      </div>

      <div class="card p-4 mb-4 flex flex-wrap gap-2">
        <div class="relative flex-1 min-w-64">
          <svg class="absolute left-3 top-2.5 text-slate-400" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="search-projects" type="text" placeholder="Search project or location…" value="${esc(f.search)}"
            oninput="state.projectFilter.search=this.value; render()"
            class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
        </div>
        <select onchange="state.projectFilter.status=this.value; renderProjects()" class="px-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
          <option value="">All statuses</option>
          <option value="active" ${f.status==='active'?'selected':''}>Active</option>
          <option value="not_active" ${f.status==='not_active'?'selected':''}>Not Active</option>
        </select>
      </div>

      ${filtered.length === 0
        ? `<div class="card p-16 text-center">
            <div class="text-slate-400 mb-4">No projects yet</div>
            <button onclick="openNewModal('project')" class="gold-btn px-4 py-2 text-sm rounded-lg font-semibold">Create your first project</button>
          </div>`
        : `<div class="grid grid-cols-2 gap-4">
            ${filtered.map(p => {
              const s = projectStats(p);
              const status = p.status || 'active';
              const expanded = isInlineEditing('project', p.id);
              return `<div class="card ${expanded ? 'col-span-2' : ''}">
                <div class="p-5 cursor-pointer transition-shadow hover:shadow-md ${expanded ? '' : ''}" onclick="openEditInline('project','${esc(p.id)}')" style="${expanded?'background: var(--paper-soft);':''}">
                  <div class="flex items-start justify-between mb-3">
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2 flex-wrap mb-1">
                        <svg class="flex-shrink-0" width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="color: var(--warm); transform: rotate(${expanded?90:0}deg); transition: transform 0.15s;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                        <h3 class="font-display text-xl font-medium" style="color: var(--ink);">${esc(p.name)}</h3>
                        ${(() => {
                          const pCol = PROJECT_STATUS[status] || PROJECT_STATUS.active;
                          return `<select onchange="event.stopPropagation();updateProjectField('${esc(p.id)}','status',this.value)" onclick="event.stopPropagation()" class="pill-select" style="background-color:${pCol.bg}; color:${pCol.fg}; border:1px solid ${pCol.d}33;">
                            <option value="active" ${status==='active'?'selected':''}>Active</option>
                            <option value="not_active" ${status==='not_active'?'selected':''}>Not Active</option>
                          </select>`;
                        })()}
                      </div>
                      <div class="text-xs" style="color: var(--warm);">
                        ${p.location ? esc(p.location) + ' · ' : ''}${p.type ? esc(p.type) + ' · ' : ''}${p.keys ? p.keys + ' keys · ' : ''}${fmtEUR(p.targetAmount)}
                      </div>
                    </div>
                    <button onclick="event.stopPropagation();openProjectDetail('${esc(p.id)}')"
                      class="text-xs px-2 py-1 rounded border hover:bg-gray-100" style="color: var(--warm); border-color: var(--line);">Open</button>
                  </div>
                  ${p.description ? `<div class="text-sm mb-3 line-clamp-2" style="color: var(--ink); opacity: 0.7;">${esc(p.description)}</div>` : ''}
                  <div class="flex items-center gap-4 text-xs pt-3 border-t" style="color: var(--warm); border-color: var(--line-soft);">
                    <span><span class="num font-semibold" style="color: var(--ink);">${s.companyIds.length}</span> companies</span>
                    <span><span class="num font-semibold" style="color: var(--ink);">${s.interactions.length}</span> interactions</span>
                    ${s.pending > 0 ? `<span style="color: #a04330;"><span class="num font-semibold">${s.pending}</span> pending</span>` : ''}
                    <span class="ml-auto">${s.latest ? 'latest ' + fmtDate(s.latest.date) : 'no activity'}</span>
                  </div>
                </div>
                ${expanded ? renderInlineEditForm('project', p, { title: p.name }) : ''}
              </div>`;
            }).join('')}
          </div>`}
    </div>
  `;
}
