function renderFocusedDashboard(focus) {
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const thirtyD = new Date(todayD); thirtyD.setDate(thirtyD.getDate() - 30);

  if (focus.type === 'project') {
    const proj = state.projects.find(p => p.id === focus.id);
    if (!proj) return '<div class="card p-8 text-center" style="color: var(--warm);">Project not found.</div>';
    const projInts = state.interactions.filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(proj.id))
      .sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    const companyIds = [...new Set(projInts.map(i => i.companyId).filter(Boolean))];
    const companies = companyIds.map(id => state.companies.find(c => c.id === id)).filter(Boolean);
    // Companies engaged table data
    const coRows = companies.map(co => {
      const cInts = projInts.filter(i => i.companyId === co.id).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
      const latest = cInts[0];
      const daysSince = latest && latest.date ? Math.floor((todayD - new Date(latest.date))/86400000) : null;
      const followUp = latest && latest.followUpDate ? new Date(latest.followUpDate) : null;
      const isOverdue = followUp && followUp < todayD && !latest.completed;
      return { co, latest, daysSince, followUp, isOverdue, intCount: cInts.length };
    }).sort((a,b) => new Date(b.latest?.date||0) - new Date(a.latest?.date||0));

    const pending = projInts.filter(i => i.kpi === 'action_required' && !i.completed);
    const stale = coRows.filter(r => r.latest && new Date(r.latest.date) < thirtyD && !INACTIVE_KPIS.has(r.latest.kpi));

    return `
      <!-- Companies engaged on this project -->
      <div class="card overflow-hidden mb-4">
        <div class="px-5 py-4 border-b flex items-center justify-between" style="border-color: var(--line-soft);">
          <h2 class="font-display text-lg font-medium">Companies on ${esc(proj.name)} <span class="text-sm font-normal" style="color: var(--warm);">(${coRows.length})</span></h2>
          <div class="text-xs" style="color: var(--warm);">Sorted by latest activity</div>
        </div>
        ${coRows.length === 0 ? `<div class="p-8 text-center" style="color: var(--warm);">No companies engaged on this project yet.</div>` : `
        <table class="w-full text-sm">
          <thead class="border-b" style="border-color: var(--line);">
            <tr class="text-xs uppercase tracking-wider" style="color: var(--warm);">
              <th class="text-left px-5 py-3 font-semibold">Company</th>
              <th class="text-left px-5 py-3 font-semibold">Status</th>
              <th class="text-left px-5 py-3 font-semibold">Last touch</th>
              <th class="text-left px-5 py-3 font-semibold">Latest KPI</th>
              <th class="text-left px-5 py-3 font-semibold">Subject</th>
              <th class="text-left px-5 py-3 font-semibold">Next action</th>
            </tr>
          </thead>
          <tbody>
            ${coRows.map(r => {
              const expanded = state.projectCompanyExpanded === r.co.id;
              const allCoIntsThisProj = projInts.filter(i => i.companyId === r.co.id).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
              return `
              <tr class="border-b row-hover cursor-pointer" style="border-color: var(--line-soft); ${expanded?'background: var(--paper-soft);':''}" onclick="toggleProjectCompanyRow('${esc(r.co.id)}')">
                <td class="px-5 py-3">
                  <div class="flex items-center gap-3">
                    <svg class="flex-shrink-0" width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="color: var(--warm); transform: rotate(${expanded?90:0}deg); transition: transform 0.15s;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-[10px] font-semibold flex-shrink-0" style="background:${avatarColor(r.co.name)};">${getInitials(r.co.name)}</div>
                    <div>
                      <div class="font-semibold text-sm" style="color: var(--ink);">${esc(r.co.name)}</div>
                      <div class="text-xs" style="color: var(--warm);">${esc(r.co.country||'')} · ${typeLabel(r.co)}</div>
                    </div>
                  </div>
                </td>
                <td class="px-5 py-3">${pill(STATUS, getStatus(r.co))}</td>
                <td class="px-5 py-3 num text-xs" style="color: var(--warm);">${r.latest ? fmtDateShort(r.latest.date) + (r.daysSince!=null ? ' · '+r.daysSince+'d' : '') : '—'}</td>
                <td class="px-5 py-3">${r.latest ? pill(KPI, r.latest.kpi) : ''}${r.latest && r.latest.notInterestedReason && r.latest.kpi==='not_interested' ? `<div class="text-[10px] mt-1 italic" style="color: var(--warm);" title="${esc(r.latest.notInterestedReason)}">${esc(r.latest.notInterestedReason.length > 60 ? r.latest.notInterestedReason.slice(0,60)+'…' : r.latest.notInterestedReason)}</div>` : ''}</td>
                <td class="px-5 py-3 text-xs" style="color: var(--ink);">${esc(r.latest?.subject || '—')}</td>
                <td class="px-5 py-3 text-xs num" style="color: ${r.isOverdue ? '#a04330' : 'var(--warm)'};">${r.followUp ? (r.isOverdue ? '⚠ overdue · ' : '↻ ') + fmtDate(r.followUp) : '—'}</td>
              </tr>
              ${expanded ? `
              <tr style="background: var(--paper-soft); border-bottom: 1px solid var(--line);">
                <td colspan="6" class="px-5 py-4" onclick="event.stopPropagation()">
                  <div class="grid grid-cols-3 gap-5">
                    <!-- What they do + meta -->
                    <div>
                      <div class="text-[10px] uppercase tracking-wider font-semibold mb-1" style="color: var(--warm);">What they do</div>
                      <div class="text-xs leading-relaxed" style="color: var(--ink);">${esc(r.co.focus || '—')}</div>
                      ${r.co.history ? `<div class="mt-2"><div class="text-[10px] uppercase tracking-wider font-semibold mb-1" style="color: var(--warm);">History</div><div class="text-[11px] leading-relaxed" style="color: var(--ink);">${esc(r.co.history)}</div></div>` : ''}
                    </div>
                    <!-- Latest interaction quick-edit -->
                    <div>
                      <div class="text-[10px] uppercase tracking-wider font-semibold mb-2" style="color: var(--warm);">Latest interaction (on ${esc(proj.name)})</div>
                      ${r.latest ? `
                        <div class="text-xs mb-2" style="color: var(--ink);"><span class="font-semibold">${esc(r.latest.subject||'—')}</span> · <span style="color: var(--warm);">${fmtDate(r.latest.date)}</span></div>
                        <div class="flex flex-col gap-2">
                          <label class="flex items-center gap-2">
                            <span class="text-[10px] uppercase tracking-wider font-semibold w-20" style="color: var(--warm);">KPI</span>
                            <select onchange="updateInteractionKpi('${esc(r.latest.id)}', this.value)" class="flex-1 px-2 py-1.5 border rounded text-xs bg-white" style="border-color: var(--line);">
                              <option value="action_required" ${r.latest.kpi==='action_required'?'selected':''}>Action Required</option>
                              <option value="info_sent" ${r.latest.kpi==='info_sent'?'selected':''}>Info Sent</option>
                              <option value="in_conversation" ${r.latest.kpi==='in_conversation'?'selected':''}>In Conversation</option>
                              <option value="monitoring" ${r.latest.kpi==='monitoring'?'selected':''}>Monitoring</option>
                              <option value="not_interested" ${r.latest.kpi==='not_interested'?'selected':''}>Not Interested</option>
                            </select>
                          </label>
                          <label class="flex items-center gap-2">
                            <span class="text-[10px] uppercase tracking-wider font-semibold w-20" style="color: var(--warm);">Follow-up</span>
                            <input type="date" value="${r.latest.followUpDate ? r.latest.followUpDate.slice(0,10) : ''}" onchange="updateInteractionFollowUp('${esc(r.latest.id)}', this.value)" class="flex-1 px-2 py-1.5 border rounded text-xs bg-white" style="border-color: var(--line);">
                          </label>
                          <label class="flex items-center gap-2">
                            <span class="text-[10px] uppercase tracking-wider font-semibold w-20" style="color: var(--warm);">Done</span>
                            <input type="checkbox" ${r.latest.completed?'checked':''} onchange="toggleInteractionCompleted('${esc(r.latest.id)}')" class="w-4 h-4">
                            <span class="text-[11px]" style="color: var(--warm);">Mark the task on our side as done (doesn't change KPI)</span>
                          </label>
                          ${r.latest.kpi === 'not_interested' ? `
                            <label class="flex items-start gap-2" style="background:#fdf6ee; border-left:3px solid #aca497; padding:8px 10px; border-radius:4px;">
                              <span class="text-[10px] uppercase tracking-wider font-semibold w-20 pt-1" style="color: var(--warm);">Reason</span>
                              <textarea rows="2" placeholder="Why not interested? e.g. ticket too small, min €30M — geography mismatch — not a fit on asset class…" onblur="updateInteractionReason('${esc(r.latest.id)}', this.value)" class="flex-1 px-2 py-1.5 border rounded text-xs bg-white" style="border-color: var(--line);">${esc(r.latest.notInterestedReason||'')}</textarea>
                            </label>
                          ` : ''}
                        </div>
                      ` : `<div class="text-xs" style="color: var(--warm);">No interactions linked to this project yet.</div>`}
                    </div>
                    <!-- Actions + history -->
                    <div>
                      <div class="text-[10px] uppercase tracking-wider font-semibold mb-2" style="color: var(--warm);">Actions</div>
                      <div class="flex flex-col gap-1.5 mb-3">
                        ${r.latest ? `<button onclick="openActionItem('${esc(r.latest.id)}','action_required')" class="text-left ghost-btn px-3 py-1.5 text-xs rounded font-medium">Draft follow-up email →</button>` : ''}
                        ${r.latest ? `<button onclick="openEditModal('interaction','${esc(r.latest.id)}')" class="text-left ghost-btn px-3 py-1.5 text-xs rounded font-medium">Edit full interaction →</button>` : ''}
                        <button onclick="closeDashboardFocusGoToCompanyDetail('${esc(r.co.id)}')" class="text-left gold-btn px-3 py-1.5 text-xs rounded font-semibold">Open company page →</button>
                      </div>
                      ${allCoIntsThisProj.length > 1 ? `
                        <div class="text-[10px] uppercase tracking-wider font-semibold mb-1" style="color: var(--warm);">All on ${esc(proj.name)} (${allCoIntsThisProj.length})</div>
                        <div class="space-y-1 max-h-32 overflow-y-auto pr-1">
                          ${allCoIntsThisProj.slice(0,8).map(ii => `<div class="flex items-center gap-2 text-[11px]" style="color: var(--ink);">
                            ${pill(KPI, ii.kpi)}
                            <span class="truncate flex-1">${esc(ii.subject||'—')}</span>
                            <span class="num" style="color: var(--warm);">${fmtDateShort(ii.date)}</span>
                          </div>`).join('')}
                        </div>
                      ` : ''}
                    </div>
                  </div>
                </td>
              </tr>` : ''}
            `;
            }).join('')}
          </tbody>
        </table>`}
      </div>

      ${pending.length > 0 ? `
      <div class="card p-5 mb-4" style="border-left: 3px solid #b04c32;">
        <h2 class="font-display text-lg font-medium mb-3 flex items-center gap-2">
          <span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:#b04c32;"></span>
          Pending on ${esc(proj.name)} <span class="text-sm font-normal" style="color: var(--warm);">(${pending.length})</span>
        </h2>
        <div class="space-y-2">
          ${pending.map(i => {
            const co = state.companies.find(c => c.id === i.companyId);
            const isOverdue = i.followUpDate && new Date(i.followUpDate) < todayD;
            return `<div class="flex items-start gap-3 py-2 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="openEditModal('interaction','${esc(i.id)}')">
              <div class="w-8 h-8 rounded flex items-center justify-center text-white text-[10px] font-semibold flex-shrink-0" style="background:${avatarColor(co?co.name:'')};">${getInitials(co?co.name:'?')}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-medium text-sm" style="color: var(--ink);">${esc(co?co.name:'—')}</span>
                  <span class="text-xs" style="color: var(--warm);">·</span>
                  <span class="text-sm" style="color: var(--ink);">${esc(i.subject || '')}</span>
                </div>
                <div class="text-[11px] num mt-0.5" style="color: ${isOverdue ? '#a04330' : 'var(--warm)'};">${isOverdue ? '⚠ Overdue · was ' : 'Due '}${fmtDate(i.followUpDate || i.date)}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      ` : ''}

      ${stale.length > 0 ? `
      <div class="card p-5 mb-4">
        <h2 class="font-display text-lg font-medium mb-3 flex items-center gap-2">
          <span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--warm);"></span>
          Going silent on ${esc(proj.name)} <span class="text-sm font-normal" style="color: var(--warm);">(${stale.length})</span>
        </h2>
        <div class="space-y-1">
          ${stale.map(r => `<div class="flex items-center gap-3 py-2 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="closeDashboardFocusGoToCompanyDetail('${esc(r.co.id)}')">
            <div class="w-7 h-7 rounded flex items-center justify-center text-white text-[10px] font-semibold flex-shrink-0" style="background:${avatarColor(r.co.name)};">${getInitials(r.co.name)}</div>
            <div class="flex-1 min-w-0">
              <span class="font-medium text-sm" style="color: var(--ink);">${esc(r.co.name)}</span>
              <span class="text-xs ml-2" style="color: var(--warm);">silent ${r.daysSince}d · last ${fmtDate(r.latest.date)}</span>
            </div>
          </div>`).join('')}
        </div>
      </div>
      ` : ''}

      <!-- Recent activity (timeline) -->
      <div class="card p-5">
        <h2 class="font-display text-lg font-medium mb-3">Timeline <span class="text-sm font-normal" style="color: var(--warm);">(${projInts.length})</span></h2>
        ${projInts.length === 0 ? `<div class="text-sm py-4 text-center" style="color: var(--warm);">No interactions yet.</div>` : `
        <div class="divide-y" style="border-color: var(--line-soft);">
          ${projInts.slice(0, 15).map(i => {
            const co = state.companies.find(c => c.id === i.companyId);
            const ct = state.contacts.find(c => c.id === i.contactId);
            return `<div class="flex items-start gap-4 py-3 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="openEditModal('interaction','${esc(i.id)}')">
              <div class="text-right num text-xs flex-shrink-0" style="color: var(--warm); width: 70px;">
                <div style="color: var(--ink); font-weight: 500;">${fmtDateShort(i.date)}</div>
                <div class="mt-0.5">${relTime(i.date)}</div>
              </div>
              <div class="flex-1 min-w-0 border-l pl-4" style="border-color: var(--line-soft);">
                <div class="flex items-center gap-2 flex-wrap mb-0.5">
                  <span class="font-semibold text-sm" style="color: var(--ink);">${esc(co?co.name:'—')}</span>
                  ${i.kind ? `<span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded" style="background: var(--paper); color: var(--warm);">${esc(i.kind)}</span>` : ''}
                  ${pill(KPI, i.kpi)}
                </div>
                <div class="font-medium text-sm" style="color: var(--ink);">${esc(i.subject || '')}</div>
                ${i.summary ? `<div class="text-sm line-clamp-2" style="color: var(--ink); opacity: 0.7;">${esc(i.summary)}</div>` : ''}
                ${ct ? `<div class="text-xs mt-1" style="color: var(--warm);">${esc(ct.firstName+' '+ct.lastName)}</div>` : ''}
              </div>
            </div>`;
          }).join('')}
          ${projInts.length > 15 ? `<div class="text-xs text-center pt-3" style="color: var(--warm);">+ ${projInts.length - 15} earlier interactions</div>` : ''}
        </div>`}
      </div>
    `;
  }

  if (focus.type === 'company') {
    const co = state.companies.find(c => c.id === focus.id);
    if (!co) return '<div class="card p-8 text-center" style="color: var(--warm);">Company not found.</div>';
    const cInts = state.interactions.filter(i => i.companyId === co.id).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    const contacts = state.contacts.filter(c => c.companyId === co.id);
    const directProjIds = Array.isArray(co.projectIds) ? co.projectIds : [];
    const intProjIds = cInts.flatMap(i => Array.isArray(i.projectIds) ? i.projectIds : []);
    const projIds = [...new Set([...directProjIds, ...intProjIds])];
    const projects = projIds.map(id => state.projects.find(p => p.id === id)).filter(Boolean);
    const pending = cInts.filter(i => i.kpi === 'action_required' && !i.completed);

    return `
      <!-- Contacts -->
      <div class="card p-5 mb-4">
        <h2 class="font-display text-lg font-medium mb-3">Contacts <span class="text-sm font-normal" style="color: var(--warm);">(${contacts.length})</span></h2>
        ${contacts.length === 0 ? `<div class="text-sm py-4 text-center" style="color: var(--warm);">No contacts captured yet.</div>` : `
        <div class="grid grid-cols-2 gap-3">
          ${contacts.map(ct => `<div class="border rounded-lg p-3 cursor-pointer hover:shadow-sm" style="border-color: var(--line-soft);" onclick="openEditModal('contact','${esc(ct.id)}')">
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-[10px] font-semibold flex-shrink-0" style="background:${avatarColor((ct.firstName||'')+' '+(ct.lastName||''))};">${getInitials((ct.firstName||'')+' '+(ct.lastName||''))}</div>
              <div class="flex-1 min-w-0">
                <div class="font-semibold text-sm" style="color: var(--ink);">${esc((ct.firstName||'')+' '+(ct.lastName||''))}</div>
                <div class="text-xs" style="color: var(--warm);">${esc(ct.position || '—')}</div>
                ${ct.email ? `<div class="text-xs mt-1"><a href="mailto:${esc(ct.email)}" onclick="event.stopPropagation()" class="hover:underline" style="color: var(--green);">${esc(ct.email)}</a></div>` : ''}
                ${ct.phone ? `<div class="text-xs num" style="color: var(--warm);">${esc(ct.phone)}</div>` : ''}
              </div>
            </div>
          </div>`).join('')}
        </div>`}
      </div>

      <!-- Projects associated -->
      ${projects.length > 0 ? `
      <div class="card p-5 mb-4">
        <h2 class="font-display text-lg font-medium mb-3">Projects associated <span class="text-sm font-normal" style="color: var(--warm);">(${projects.length})</span></h2>
        <div class="flex flex-wrap gap-2">
          ${projects.map(p => `<button onclick="applyDashboardSearch('${esc(p.name)}')" class="text-xs px-3 py-1.5 rounded border hover:bg-white inline-flex items-center gap-2" style="border-color: var(--line); color: var(--green);">${esc(p.name)} ${pill(PROJECT_STATUS, p.status||'active')}</button>`).join('')}
        </div>
      </div>
      ` : ''}

      ${pending.length > 0 ? `
      <div class="card p-5 mb-4" style="border-left: 3px solid #b04c32;">
        <h2 class="font-display text-lg font-medium mb-3 flex items-center gap-2">
          <span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:#b04c32;"></span>
          Pending action items <span class="text-sm font-normal" style="color: var(--warm);">(${pending.length})</span>
        </h2>
        <div class="space-y-2">
          ${pending.map(i => `<div class="flex items-start gap-3 py-2 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="openEditModal('interaction','${esc(i.id)}')">
            <div class="flex-1 min-w-0">
              <div class="font-medium text-sm" style="color: var(--ink);">${esc(i.subject || '')}</div>
              <div class="text-xs mt-0.5" style="color: var(--warm);">${i.followUpDate ? 'Due '+fmtDate(i.followUpDate) : fmtDate(i.date)} ${i.outcome ? '· '+esc(i.outcome) : ''}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>
      ` : ''}

      <!-- Timeline -->
      <div class="card p-5">
        <h2 class="font-display text-lg font-medium mb-3">All interactions <span class="text-sm font-normal" style="color: var(--warm);">(${cInts.length})</span></h2>
        ${cInts.length === 0 ? `<div class="text-sm py-4 text-center" style="color: var(--warm);">No interactions yet.</div>` : `
        <div class="divide-y" style="border-color: var(--line-soft);">
          ${cInts.slice(0, 20).map(i => {
            const ct = state.contacts.find(c => c.id === i.contactId);
            const intProjects = (Array.isArray(i.projectIds) ? i.projectIds : []).map(pid => state.projects.find(p => p.id === pid)).filter(Boolean);
            return `<div class="flex items-start gap-4 py-3 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="openEditModal('interaction','${esc(i.id)}')">
              <div class="text-right num text-xs flex-shrink-0" style="color: var(--warm); width: 70px;">
                <div style="color: var(--ink); font-weight: 500;">${fmtDateShort(i.date)}</div>
                <div class="mt-0.5">${relTime(i.date)}</div>
              </div>
              <div class="flex-1 min-w-0 border-l pl-4" style="border-color: var(--line-soft);">
                <div class="flex items-center gap-2 flex-wrap mb-0.5">
                  ${i.kind ? `<span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded" style="background: var(--paper); color: var(--warm);">${esc(i.kind)}</span>` : ''}
                  ${pill(KPI, i.kpi)}
                  ${intProjects.map(p => `<span class="text-[10px] px-1.5 py-0.5 rounded font-medium" style="background: rgba(35,59,52,0.08); color: var(--green);">${esc(p.name)}</span>`).join('')}
                </div>
                <div class="font-medium text-sm" style="color: var(--ink);">${esc(i.subject || '')}</div>
                ${i.summary ? `<div class="text-sm line-clamp-2" style="color: var(--ink); opacity: 0.7;">${esc(i.summary)}</div>` : ''}
                ${ct ? `<div class="text-xs mt-1" style="color: var(--warm);">${esc(ct.firstName+' '+ct.lastName)}</div>` : ''}
              </div>
            </div>`;
          }).join('')}
          ${cInts.length > 20 ? `<div class="text-xs text-center pt-3" style="color: var(--warm);">+ ${cInts.length - 20} earlier interactions</div>` : ''}
        </div>`}
      </div>
    `;
  }

  if (focus.type === 'contact') {
    const ct = state.contacts.find(c => c.id === focus.id);
    if (!ct) return '<div class="card p-8 text-center" style="color: var(--warm);">Contact not found.</div>';
    const co = state.companies.find(c => c.id === ct.companyId);
    const ints = state.interactions.filter(i => i.contactId === ct.id).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    const sameCo = state.contacts.filter(c => c.companyId === ct.companyId && c.id !== ct.id);
    const pending = ints.filter(i => i.kpi === 'action_required' && !i.completed);

    return `
      ${pending.length > 0 ? `
      <div class="card p-5 mb-4" style="border-left: 3px solid #b04c32;">
        <h2 class="font-display text-lg font-medium mb-3 flex items-center gap-2">
          <span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:#b04c32;"></span>
          Pending with ${esc(ct.firstName||'')} ${esc(ct.lastName||'')} <span class="text-sm font-normal" style="color: var(--warm);">(${pending.length})</span>
        </h2>
        <div class="space-y-2">
          ${pending.map(i => `<div class="flex items-start gap-3 py-2 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="openEditModal('interaction','${esc(i.id)}')">

// Filter an interaction by focus
function interactionMatchesFocus(i, focus) {
  if (!focus || focus.type === 'all') return true;
  if (focus.type === 'project') return Array.isArray(i.projectIds) && i.projectIds.includes(focus.id);
  if (focus.type === 'company') return i.companyId === focus.id;
  if (focus.type === 'contact') return i.contactId === focus.id;
  if (focus.type === 'text') {
    const q = focus.query.toLowerCase();
    return (i.subject||'').toLowerCase().includes(q) || (i.summary||'').toLowerCase().includes(q) || (i.outcome||'').toLowerCase().includes(q);
  }
  return true;
}

// Filter a company by focus
function companyMatchesFocus(co, focus) {
  if (!focus || focus.type === 'all') return true;
  if (focus.type === 'project') {
    const direct = Array.isArray(co.projectIds) && co.projectIds.includes(focus.id);
    const viaInts = state.interactions.some(i => i.companyId === co.id && Array.isArray(i.projectIds) && i.projectIds.includes(focus.id));
    return direct || viaInts;
  }
  if (focus.type === 'company') return co.id === focus.id;
  if (focus.type === 'contact') {
    const ct = state.contacts.find(c => c.id === focus.id);
    return ct && ct.companyId === co.id;
  }
  if (focus.type === 'text') {
    const q = focus.query.toLowerCase();
    return (co.name||'').toLowerCase().includes(q) || (co.country||'').toLowerCase().includes(q) || (co.focus||'').toLowerCase().includes(q);
  }
  return true;
}

// ============================================================
//  FILE SYSTEM ACCESS
// ============================================================
let fileHandle = null;
let _fileMtime = 0;   // last-seen file modified time — used to auto-reload on external (Claude) edits
let fileName = '';
const FS_SUPPORTED = 'showOpenFilePicker' in window;

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('boa-crm-handles', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function persistHandle(handle) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'main');
    return new Promise(res => tx.oncomplete = res);
  } catch(e) { console.warn('persistHandle failed', e); }
}

async function loadHandle() {
  try {
    const db = await openHandleDB();
    return new Promise(resolve => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get('main');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch(e) { return null; }
}

async function clearHandle() {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete('main');
    return new Promise(res => tx.oncomplete = res);
  } catch(e) {}
}

async function connectFile() {
  if (!FS_SUPPORTED) {
    alert('Your browser does not support direct file access.\nUse Chrome or Edge.\n\nIn the meantime, use Import/Export JSON.');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'CRM Data', accept: { 'application/json': ['.json'] } }],
      multiple: false,
      suggestedName: 'boa-crm-data.json'
    });
    fileHandle = handle;
    fileName = handle.name;
    await persistHandle(handle);
    await loadFromFile();
    updateButtons();
  } catch(err) {
    if (err.name !== 'AbortError') alert('Error connecting to file: ' + err.message);
  }
}

async function loadFromFile() {
  if (!fileHandle) return false;
  try {
    const file = await fileHandle.getFile();
    _fileMtime = file.lastModified || 0;
    const text = await file.text();
    const data = text.trim() ? JSON.parse(text) : {};
    state.companies = Array.isArray(data.companies) ? data.companies : [];
    state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
    state.interactions = Array.isArray(data.interactions) ? data.interactions : [];
    state.projects = Array.isArray(data.projects) ? data.projects : [];
    state.meetings = Array.isArray(data.meetings) ? data.meetings : [];
    state.relationships = Array.isArray(data.relationships) ? data.relationships : [];
    state.lastUpdatedByClaudeCode = data.lastUpdatedByClaudeCode || null;
    state.lastUpdatedByUser = data.lastUpdatedByUser || null;
    updateStatus('synced');
    render();
    return true;
  } catch(err) {
    console.error('loadFromFile', err);
    alert('Error reading file: ' + err.message);
    return false;
  }
}

async function saveToFile() {
  if (!fileHandle) {
    saveToStorage();
    return;
  }
  try {
    const perm = await fileHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      const newPerm = await fileHandle.requestPermission({ mode: 'readwrite' });
      if (newPerm !== 'granted') throw new Error('No write permission');
    }
    state.lastUpdatedByUser = new Date().toISOString();
    const data = { initialized:true, lastUpdatedByClaudeCode: state.lastUpdatedByClaudeCode, lastUpdatedByUser: state.lastUpdatedByUser, companies:state.companies, contacts:state.contacts, interactions:state.interactions, projects:state.projects, meetings:state.meetings, relationships:state.relationships };
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    try { const f = await fileHandle.getFile(); _fileMtime = f.lastModified || 0; } catch(e) {}
    updateStatus('saved');
  } catch(err) {
    console.error('saveToFile', err);
    alert('Error saving: ' + err.message);
    saveToStorage();
  }
}

async function syncFile() {
  if (!fileHandle) { await connectFile(); return; }
  await loadFromFile();
}

// Auto-reload when the tab regains focus IF the file changed externally (e.g. Claude edited it).
// Safe because in-app edits autosave immediately, so the file is always the source of truth.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !fileHandle || READ_ONLY) return;
  fileHandle.getFile()
    .then(f => { if ((f.lastModified || 0) > _fileMtime) loadFromFile(); })
    .catch(() => {});
});

async function disconnectFile() {
  if (!confirm('Disconnect from file? You will go back to browser storage.')) return;
  fileHandle = null;
  fileName = '';
  await clearHandle();
  updateButtons();
  updateStatus();
}

function updateButtons() {
  const ids = ['btn-connect','btn-sync','btn-export','btn-share','btn-publish','btn-import'];
  if (READ_ONLY) {
    ids.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
    return;
  }
  const connected = !!fileHandle;
  const hasData = state.companies.length > 0 || state.contacts.length > 0;
  document.getElementById('btn-connect').style.display = connected ? 'none' : 'flex';
  document.getElementById('btn-sync').style.display = connected ? 'flex' : 'none';
  document.getElementById('btn-export').style.display = hasData ? 'flex' : 'none';
  document.getElementById('btn-share').style.display = hasData ? 'flex' : 'none';
  document.getElementById('btn-publish').style.display = hasData ? 'flex' : 'none';
  document.getElementById('btn-import').style.display = connected ? 'none' : 'flex';
}

// ============================================================
//  PERSISTENCE (localStorage fallback)
// ============================================================
function storageAvailable() {
  try { localStorage.setItem('_test', '1'); localStorage.removeItem('_test'); return true; }
  catch(e) { return false; }
}

function loadFromStorage() {
  if (!storageAvailable()) return false;
  try {
    const saved = localStorage.getItem('boa-crm-data');
    if (saved) {
      const data = JSON.parse(saved);
      state.companies = data.companies || [];
      state.contacts = data.contacts || [];
      state.interactions = data.interactions || [];
      state.projects = data.projects || [];
      state.meetings = data.meetings || [];
      state.relationships = data.relationships || [];
      state.lastUpdatedByClaudeCode = data.lastUpdatedByClaudeCode || null;
      state.lastUpdatedByUser = data.lastUpdatedByUser || null;
      updateStatus();
      return true;
    }
  } catch(e) { console.warn('loadFromStorage', e); }
  return false;
}

function saveToStorage() {
  if (!storageAvailable()) {
    console.warn('localStorage unavailable (probably opened via data: or in preview). Data will not persist until you connect to a file.');
    updateStatus();
    return;
  }
  try {
    state.lastUpdatedByUser = new Date().toISOString();
    localStorage.setItem('boa-crm-data', JSON.stringify({
      initialized:true, lastUpdatedByClaudeCode: state.lastUpdatedByClaudeCode, lastUpdatedByUser: state.lastUpdatedByUser, companies:state.companies, contacts:state.contacts, interactions:state.interactions, projects:state.projects
    }));
    updateStatus('saved');
  } catch(e) { console.warn('saveToStorage', e); }
}

// Unified save — uses file if connected, else localStorage
async function saveData() {
  if (fileHandle) await saveToFile();
  else saveToStorage();
}

function updateStatus(mode) {
  document.getElementById('badge-companies').textContent = state.companies.length || '';
  document.getElementById('badge-contacts').textContent = state.contacts.length || '';
  document.getElementById('badge-interactions').textContent = state.interactions.length || '';
  const projBadge = document.getElementById('badge-projects');
  if (projBadge) projBadge.textContent = state.projects.length || '';
  // Last-updated timestamps under sidebar
  const ts = document.getElementById('data-timestamps');
  if (ts) {
    const fmt = (iso) => iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
    ts.innerHTML = `
      <div class="flex items-center justify-between gap-2 mb-0.5"><span style="opacity:0.6;">Claude:</span> <span class="num" style="opacity:0.85;">${fmt(state.lastUpdatedByClaudeCode)}</span></div>
      <div class="flex items-center justify-between gap-2"><span style="opacity:0.6;">You:</span> <span class="num" style="opacity:0.85;">${fmt(state.lastUpdatedByUser)}</span></div>

  }
  const el = document.getElementById('data-status');
  if (!state.companies.length && !state.contacts.length) {
    el.innerHTML = `<div style="color: rgba(226,223,214,0.75);">No data</div><div style="color: rgba(226,223,214,0.4); margin-top: 2px;">${FS_SUPPORTED ? 'Connect to file' : 'Import JSON'}</div>`;
    return;
  }
  const now = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  let line1, line2;
  if (fileHandle) {
    line1 = `<span style="color: rgba(226,223,214,0.85);">📄 ${esc(fileName)}</span>`;
    line2 = mode === 'saved' ? `<span style="color: rgba(226,223,214,0.5);">✓ Saved · ${now}</span>`
          : mode === 'synced' ? `<span style="color: rgba(226,223,214,0.5);">↻ Synced · ${now}</span>`
          : `<span style="color: rgba(226,223,214,0.4);">${state.companies.length + state.contacts.length + state.interactions.length} records</span>`;
  } else {
    line1 = `<span style="color: rgba(226,223,214,0.55);">Browser (localStorage)</span>`;
    line2 = mode === 'saved' ? `<span style="color: rgba(226,223,214,0.5);">✓ Saved · ${now}</span>`
          : `<span style="color: rgba(226,223,214,0.4);">${state.companies.length + state.contacts.length + state.interactions.length} records</span>`;
  }
  el.innerHTML = `<div>${line1}</div><div style="margin-top: 2px;" class="num">${line2}</div>`;
}

function importJSON(event) {
  const input = event.target;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => alert('Error reading file: ' + reader.error);
  reader.onload = async (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err) {
      console.error('[importJSON] JSON parse failed:', err);
      alert('Invalid JSON: ' + err.message);
      return;
    }
    try {
      state.companies = Array.isArray(data.companies) ? data.companies : [];
      state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
      state.interactions = Array.isArray(data.interactions) ? data.interactions : [];
      state.projects = Array.isArray(data.projects) ? data.projects : [];
      state.meetings = Array.isArray(data.meetings) ? data.meetings : [];
    state.relationships = Array.isArray(data.relationships) ? data.relationships : [];
    } catch(err) {
      console.error('[importJSON] state assign failed:', err);
      alert('Unexpected JSON structure: ' + err.message);
      return;
    }
    try {
      await saveData();
    } catch(err) {
      console.error('[importJSON] save failed:', err);
      alert('Error saving: ' + err.message);
    }
    try {
      render();
    } catch(err) {
      console.error('[importJSON] render failed:', err);
      alert('Error rendering interface: ' + err.message + '\n\nCheck the console (F12).');
      return;
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function exportJSON() {
  // IMPORTANT: must mirror the full save schema. Missing fields (projects, relationships, meetings)
  // would silently drop entire dashboard sections (Pipeline, Momentum, Calendar) on re-import.
  const data = {

function getSelfHtml() {
  // Clone the document so we don't mutate live UI
  const clone = document.documentElement.cloneNode(true);

  // Clear dynamic content in clone (will be re-rendered on load in the share file)
  ['dashboard','companies','contacts','interactions'].forEach(v => {
    const el = clone.querySelector('#view-' + v);
    if (el) el.innerHTML = '';
  });
  clone.querySelectorAll('[id^="badge-"]').forEach(el => el.textContent = '');
  const status = clone.querySelector('#data-status');
  if (status) status.innerHTML = '';

  // Reset modal state
  const modal = clone.querySelector('#modal-overlay');
  if (modal) modal.className = 'modal-overlay';

  // Remove dynamically-added banners or password gate from clone
  ['password-gate'].forEach(id => clone.querySelector('#'+id)?.remove());
  clone.querySelectorAll('body > div.fixed').forEach(el => el.remove());

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}

async function buildShareHtml(encryptWithPassword) {
  // Try fetch first (works when served via http); fall back to DOM serialization (works on file://)
  let html;
  try {
    const res = await fetch(window.location.href, { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch not ok');
    html = await res.text();
  } catch(e) {
    html = getSelfHtml();
  }

  const data = { companies: state.companies, contacts: state.contacts, interactions: state.interactions, projects: state.projects, meetings: state.meetings, relationships: state.relationships, lastUpdatedByClaudeCode: state.lastUpdatedByClaudeCode, lastUpdatedByUser: state.lastUpdatedByUser };

  if (encryptWithPassword) {
    const encrypted = await encryptPayload(data, encryptWithPassword);
    const payload = JSON.stringify(encrypted).replace(/<\/script>/gi, '<\\/script>');
    html = html.replace(
      /const ENCRYPTED_DATA = null; \/\*__ENCRYPTED_DATA__\*\//,
      `const ENCRYPTED_DATA = ${payload}; /*__ENCRYPTED_DATA__*/`
    );
  } else {
    const payload = JSON.stringify(data).replace(/<\/script>/gi, '<\\/script>');
    html = html.replace(
      /const SHARED_DATA = null; \/\*__SHARED_DATA__\*\//,
      `const SHARED_DATA = ${payload}; /*__SHARED_DATA__*/`
    );
  }
  return html;
}

function utf8ToBase64(str) {
  // Handle UTF-8 properly (btoa fails on non-ASCII)
  return btoa(unescape(encodeURIComponent(str)));
}

async function publishToWeb() {
  const cfg = getPublishConfig();
  if (!cfg || !cfg.owner || !cfg.repo || !cfg.token || !cfg.viewerPassword) {
    openPublishSettings();
    return;
  }
  const btn = document.getElementById('btn-publish');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '<svg width="18" height="18" class="animate-spin" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-dasharray="40 60"/></svg> Publishing…';
  btn.style.pointerEvents = 'none';

  try {
    const html = await buildShareHtml(cfg.viewerPassword);
    const path = 'index.html';
    const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const headers = {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };

    // Get current SHA if file exists
    let sha = null;
    try {
      const existing = await fetch(apiUrl, { headers });
      if (existing.ok) {
        const j = await existing.json();
        sha = j.sha;
      }
    } catch(e) {}

    const body = {
      message: `Update CRM snapshot · ${new Date().toISOString()}`,
      content: utf8ToBase64(html),
      branch: cfg.branch || 'main'
    };
    if (sha) body.sha = sha;

    const resp = await fetch(apiUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify(body)
    });

    if (!resp.ok) {
      const errBody = await resp.text();
      throw new Error(`GitHub returned ${resp.status}: ${errBody.slice(0, 300)}`);
    }

    const publicUrl = `https://${cfg.owner}.github.io/${cfg.repo}/`;
    cfg.lastPublishedAt = new Date().toISOString();
    cfg.url = publicUrl;
    savePublishConfig(cfg);

    showPublishSuccess(publicUrl);
  } catch(err) {
    console.error('publishToWeb', err);
    alert('Publish failed:\n\n' + err.message + '\n\nCheck your token has "repo" scope and the repo exists.');
  } finally {
    btn.innerHTML = originalHtml;
    btn.style.pointerEvents = '';
  }
}

function setView(view) {
  // Re-clicking the nav while already on the same view resets any open detail page (back to list).
  // Switching from another view to one with a detail id preserves the detail.
  if (state.currentView === view) {
    if (view === 'projects' && state.projectDetailId) state.projectDetailId = null;
    if (view === 'companies' && state.companyDetailId) state.companyDetailId = null;
  }
  state.currentView = view;
  ['dashboard','companies','contacts','interactions','projects'].forEach(v => {
    document.getElementById('view-'+v).classList.toggle('hidden', v !== view);
    document.getElementById('nav-'+v).classList.toggle('active', v === view);
  });
  render();
}

function render() {
  // Preserve focus + cursor of any focused input/textarea before innerHTML wipes it
  const active = document.activeElement;
  let focusId = null, cursorStart = null, cursorEnd = null;
  if (active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
    focusId = active.id;
    try { cursorStart = active.selectionStart; cursorEnd = active.selectionEnd; } catch(e) {}
  }

  if (state.currentView === 'dashboard') renderDashboard();
  else if (state.currentView === 'companies') renderCompanies();
  else if (state.currentView === 'contacts') renderContacts();
  else if (state.currentView === 'interactions') renderInteractions();
  else if (state.currentView === 'projects') renderProjects();

  // Restore focus to the same element by id, putting cursor back where it was
  if (focusId) {
    const newEl = document.getElementById(focusId);
    if (newEl) {
      newEl.focus();
      if (cursorStart != null && typeof newEl.setSelectionRange === 'function') {
        try { newEl.setSelectionRange(cursorStart, cursorEnd ?? cursorStart); } catch(e) {}
      }
    }
  }
}

  'sweden':'SE','denmark':'DK','norway':'NO','finland':'FI','poland':'PL','romania':'RO','czechia':'CZ','czech republic':'CZ',
  'brazil':'BR','brasil':'BR','mexico':'MX','méxico':'MX','argentina':'AR','chile':'CL','colombia':'CO','peru':'PE','venezuela':'VE','uruguay':'UY','panama':'PA','panamá':'PA',
  'singapore':'SG','japan':'JP','china':'CN','hong kong':'HK','south korea':'KR','korea':'KR',

  'germany / usa':'DE/US','andorra':'AD','iceland':'IS','monaco':'MC','liechtenstein':'LI'
};
function countryCode(c) {
  if (!c) return '';
  const t = String(c).trim();
  if (!t) return '';
  const k = t.toLowerCase();
  if (COUNTRY_CODES[k]) return COUNTRY_CODES[k];
  // Already short (≤4 chars like 'PT', 'UK', 'DE/US'): keep as-is
  if (t.length <= 4) return t.toUpperCase();
  // Unknown country: take first letters of each word capitalised
  return t.split(/[\s/]+/).map(w => w[0]||'').join('').slice(0,4).toUpperCase();
}
// Legacy alias kept for any inline references; mirrors STATUS
const TEMP = STATUS;
const KPI = {
  action_required:{ label:'Action Required',  bg:'rgba(176,76,50,0.08)',  fg:'#a04330', d:'#b04c32' },
  info_sent:      { label:'Info Sent',         bg:'rgba(90,125,140,0.10)', fg:'#3f5a68', d:'#5a7d8c' },

  won:            { label:'Not Interested',    bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' }
};
// KPIs considered "inactive" for company status purposes
const INACTIVE_KPIS = new Set(['not_interested','closed','won']);

function pill(map, key) {
  const c = map[key] || { label:key||'—', bg:'rgba(172,164,151,0.15)', fg:'#6b6358', d:'#aca497' };
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-sm text-[11px] font-medium tracking-wide" style="background:${c.bg};color:${c.fg};border:1px solid ${c.d}33;"><span style="width:5px;height:5px;border-radius:50%;display:inline-block;background:${c.d};"></span>${c.label}</span>`;
}

// Three-tier status (Active / Watching / Not Active). statusOverride always wins.
// A status only counts off a REAL interaction = an email actually sent by me, a reply from them,
// or a real call/meeting. A draft (not yet sent) or a "flagged/no-email" placeholder does NOT count.
// Rules:
//  • NOT ACTIVE : no real interaction at all (incl. only-a-draft); OR 'not_interested' (no project); OR 'closed';
//                 OR a cooling (monitoring) lead silent longer than DEAD_DAYS.
//  • ACTIVE     : latest real KPI = 'in_conversation' (they replied / emailed) AND last touch ≤ STALE_DAYS.
//  • WATCHING   : I've sent something but no live two-way deal — 'info_sent' (sent, awaiting),
//                 'action_required' (chasing after no reply), 'monitoring' (cooling);
//                 OR 'not_interested' tied to a specific project; OR an 'in_conversation' gone quiet.
const STALE_DAYS = 35;   // an active conversation silent this long → Watching
const DEAD_DAYS  = 45;   // a cooling (monitoring) lead silent this long → Not Active
// A real interaction = an email/call/WhatsApp/LinkedIn that actually happened.
// Drafts, placeholders, business-card collections, and "identified/flagged" notes DO NOT count.
function isContactInteraction(i){
  const s = i.subject || '';
  if (s.includes('(DRAFT') || s.includes('(no email)') || s.includes('Status set inline')) return false;
  if (/^(Card collected|Met |Identified at|Identified |Internal flag|Cold lead|Stale —)/.test(s)) return false;
  return true;
}
function getStatus(co) {
  if (co.statusOverride === 'active' || co.statusOverride === 'watching' || co.statusOverride === 'inactive') return co.statusOverride;
  const list = state.interactions.filter(i => i.companyId === co.id && isContactInteraction(i));
  if (!list.length) return 'inactive';   // no real (sent) interaction → Not Active
  const latest = list.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
  const days = latest.date ? Math.floor((Date.now() - new Date(latest.date).getTime()) / 86400000) : 9999;
  if (INACTIVE_KPIS.has(latest.kpi)) {
    if (latest.kpi === 'not_interested' && Array.isArray(latest.projectIds) && latest.projectIds.length > 0) return 'watching';
    return 'inactive';
  }
  if (latest.kpi === 'in_conversation') return days > STALE_DAYS ? 'watching' : 'active';  // they engaged
  if (latest.kpi === 'monitoring')      return days > DEAD_DAYS  ? 'inactive' : 'watching'; // cooling → eventually dead
  return 'watching';   // info_sent / action_required = reached out / chasing, no reply yet
}

function fmtDate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); } catch(e){ return iso; } }
function fmtDateShort(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); } catch(e){ return iso; } }
function relTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso); const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)} min ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)} h ago`;
  if (diff < 604800) return `${Math.floor(diff/86400)} d ago`;
  return fmtDate(iso);
}

function avatarColor(s) {

}

// Heuristic taxonomy: from open info_sent interactions (not superseded), classify
// what we're waiting for based on keywords in subject/outcome/summary.
function dashWaitingBuckets(interactionsBase, allInteractions) {
  const txt = i => ((i.subject||'') + ' ' + (i.outcome||'') + ' ' + (i.summary||'')).toLowerCase();
  const _notSup = i => !allInteractions.some(j => j.companyId === i.companyId && j.id !== i.id && new Date(j.date||0) > new Date(i.date||0));
  // info_sent in our model is set as completed=true (sent). So filter just on kpi + not superseded.
  const openReal = interactionsBase.filter(i => i.kpi === 'info_sent' && _notSup(i));
  const buckets = {
    proposal_review:    { label:'Proposal / deck review',    items:[], color:'#3f5a68' },
    investor_feedback:  { label:'Investor feedback',         items:[], color:'#5a7d8c' },
    signed_nda:         { label:'Signed NDA',                items:[], color:'#7a5c3c' },
    call_scheduling:    { label:'Call / meeting scheduling', items:[], color:'#8f6f48' },
    generic:            { label:'General reply',             items:[], color:'var(--warm)' }
  };
  openReal.forEach(i => {
    const t = txt(i);
    if (/\bnda\b|non[- ]disclosure|confidentialit/.test(t)) buckets.signed_nda.items.push(i);
    else if (/\bschedul|book a call|set a call|propose a time|disponibilidade|chamada|agenda|conversa/.test(t)) buckets.call_scheduling.items.push(i);
    else if (/\bdeck|presentation|apresentaç|materials|proposal|teaser|investment memo|\bim\b|business plan/.test(t)) buckets.proposal_review.items.push(i);
    else if (/\bfeedback|thoughts|opinion|view on|appetite|interest/.test(t)) buckets.investor_feedback.items.push(i);
    else buckets.generic.items.push(i);
  });
  return buckets;
}

// SELF-HEALING: compute the effective last interaction date live from interactions array,
// not the stored relationship.lastInteractionDate field (which can drift if PowerShell forgets to sync).
// Falls back to the stored field if no interactions found.
function dashRelEffectiveLastDate(r, interactions) {
  if (!r || !interactions) return null;
  const coIx = interactions.filter(i => i.companyId === r.companyId && i.date);
  if (coIx.length === 0) {
    return r.lastInteractionDate ? new Date(r.lastInteractionDate) : null;
  }
  const latest = coIx.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
  return new Date(latest.date);
}

// SELF-HEALING: derive the [ACTION REQUIRED] tag for a relationship from live state,
// not from the stored prefix in r.nextAction. Returns an object { tag, overdue, days }
// or null if no action required derivable. Honours the same 4-rule logic as the PS audit.
function dashDeriveAuditTags(r, interactions, todayDate) {
  if (!r || r.status === 'Dormant') return null;
  const coIx = (interactions||[]).filter(i => i.companyId === r.companyId);
  const hasIx = coIx.length > 0;
  const latest = hasIx ? coIx.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0] : null;
  const lastDate = dashRelEffectiveLastDate(r, interactions);
  const daysSince = lastDate ? Math.floor((todayDate - lastDate) / 86400000) : null;
  let tag = null;
  if (!hasIx) tag = 'NO OUTREACH';
  else if (latest && latest.kpi === 'info_sent' && daysSince !== null && daysSince > 7) tag = 'CHASE';
  else if (['Warm','Active','Negotiation'].includes(r.status) && daysSince !== null && daysSince > 14) tag = 'STALE DEAL';
  let overdue = false;
  if (r.nextFollowUpDate) {
    const f = new Date(r.nextFollowUpDate);
    if (f < todayDate) overdue = true;
  }
  if (!tag && !overdue) return null;
  return { tag: tag || 'OVERDUE', overdue, days: daysSince };
}

// HOT/WARM/COLD/STALLED relationship momentum — SELF-HEALING from interactions.
// Dormant relationships are archived and EXCLUDED from the 4 live buckets — surfaced separately.
function dashRelMomentum(relationships, todayDate, interactions) {
  const buckets = { HOT:[], WARM:[], COLD:[], STALLED:[], DORMANT:[] };
  (relationships||[]).forEach(r => {
    if (r.status === 'Dormant') { buckets.DORMANT.push(r); return; }
    const last = dashRelEffectiveLastDate(r, interactions);
    const days = last ? Math.floor((todayDate - last) / 86400000) : null;
    const hasNext = !!(r.nextAction && String(r.nextAction).trim());
    if (!hasNext || days === null) { buckets.STALLED.push(r); return; }
    if (days <= 14)      buckets.HOT.push(r);
    else if (days <= 45) buckets.WARM.push(r);
    else if (days >= 90) buckets.COLD.push(r);
    else                  buckets.WARM.push(r); // 46–89 days
  });
  return buckets;
}

// Soonest non-completed followUp on any interaction tagged to this project.
function dashProjectMilestone(projectId, interactions) {
  const links = interactions.filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(projectId) && i.followUpDate && !i.completed);
  if (!links.length) return null;
  return links.slice().sort((a,b) => new Date(a.followUpDate) - new Date(b.followUpDate))[0];
}
function dashProjectWaitingCount(projectId, interactions, allInteractions) {
  const _notSup = i => !allInteractions.some(j => j.companyId === i.companyId && j.id !== i.id && new Date(j.date||0) > new Date(i.date||0));
  return interactions.filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(projectId) && i.kpi === 'info_sent' && _notSup(i)).length;
}

// Project momentum stats: investors / operators / meetings / pending per project
function dashProjectMomentum(projectId, companies, interactions, meetings) {
  const ix = interactions.filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(projectId));
  const coIds = [...new Set(ix.map(i => i.companyId))];
  const cos = coIds.map(cid => companies.find(c => c.id === cid)).filter(Boolean);
  const investors = cos.filter(c => c.type === 'investor').length;
  const operators = cos.filter(c => c.type === 'operator').length;
  const connectors = cos.filter(c => c.type === 'connector').length;
  const pending = ix.filter(i => i.kpi === 'action_required' && !i.completed).length;
  const meetingsN = (meetings||[]).filter(m => coIds.includes(m.companyId)).length;
  return { investors, operators, connectors, pending, meetingsN, coIds };
}

// Returns the company "type" badge HTML (Investor / Connector / Operator) + subType (Family Office / Fund / HNWI / etc.)
function dashCompanyBadge(co) {

  return `<span class="inline-flex gap-1 items-center">${typePill}${subPill}</span>`;

// Stalled relationships (>60d silence) — SELF-HEALING from interactions.
function dashStalledList(relationships, todayDate, daysThreshold, interactions) {
  daysThreshold = daysThreshold || 60;
  return (relationships||[]).filter(r => {
    if (r.status === 'Dormant') return false;
    const last = dashRelEffectiveLastDate(r, interactions);
    if (!last) return true;
    const days = Math.floor((todayDate - last) / 86400000);
    return days >= daysThreshold;
  }).sort((a,b) => {
    const da = dashRelEffectiveLastDate(a, interactions) || new Date(0);
    const db = dashRelEffectiveLastDate(b, interactions) || new Date(0);
    return da - db; // oldest first
  });
}

function renderDashboard() {

    .filter(c => getStatus(c) === 'active')

  const thirtyDaysAgo = new Date(todayDate); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

  const _notSuperseded = i => !state.interactions.some(j => j.companyId === i.companyId && j.id !== i.id && new Date(j.date||0) > new Date(i.date||0));

  const overdue = fInteractions.filter(i =>
    i.followUpDate && new Date(i.followUpDate) < todayDate && !i.completed && _notSuperseded(i)
  ).sort((a,b) => new Date(a.followUpDate) - new Date(b.followUpDate));

  const thisWeek = fInteractions.filter(i => {
    if (!i.followUpDate || i.completed) return false;
    const d = new Date(i.followUpDate);
    return d >= todayDate && d <= weekFromNow && _notSuperseded(i);
  }).sort((a,b) => new Date(a.followUpDate) - new Date(b.followUpDate));

  const actionReq = fInteractions.filter(i =>
    i.kpi === 'action_required' && !i.completed && _notSuperseded(i)
  ).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

  // === Phase 3: split follow-ups into Due Today / Due This Week / Overdue ===
  const dueToday = fInteractions.filter(i => {
    if (!i.followUpDate || i.completed) return false;
    const d = new Date(i.followUpDate);
    return d.toDateString() === todayDate.toDateString() && _notSuperseded(i);
  }).sort((a,b) => new Date(a.date||0) - new Date(b.date||0));

  const dueWeek = fInteractions.filter(i => {
    if (!i.followUpDate || i.completed) return false;
    const d = new Date(i.followUpDate);
    return d > todayDate && d <= weekFromNow && _notSuperseded(i);
  }).sort((a,b) => new Date(a.followUpDate) - new Date(b.followUpDate));

  // === Phase 3: Waiting For buckets (heuristic on info_sent open items) ===
  const waitingBuckets = dashWaitingBuckets(fInteractions, state.interactions);
  const totalWaiting = Object.values(waitingBuckets).reduce((s,b) => s + b.items.length, 0);

  // === Phase 3: Relationship momentum (HOT/WARM/COLD/STALLED) ===
  const momentum = dashRelMomentum(state.relationships, todayDate, state.interactions);

  // === Phase 3: Hot Relationships — investors + operators + connectors, active in last 30 days ===
  const HOT_REL_DAYS = 30;
  const hotInvestorsList = fCompanies
    .filter(c => ['investor','operator','connector'].includes(c.type) && getStatus(c) === 'active')
    .map(c => {
      const list = state.interactions.filter(i => i.companyId === c.id);
      const latest = list.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
      if (!latest || !latest.date) return null;
      const days = Math.floor((todayDate - new Date(latest.date)) / 86400000);
      if (days > HOT_REL_DAYS) return null;
      const rel = (state.relationships||[]).filter(r => r.companyId === c.id && r.status !== 'Dormant')[0] || null;
      const pIds = new Set();
      list.forEach(i => (i.projectIds||[]).forEach(pid => pIds.add(pid)));
      const projects = [...pIds].map(pid => state.projects.find(p => p.id === pid)).filter(Boolean);
      return { c, latest, rel, projects, days };
    })
    .filter(Boolean)
    .sort((a,b) => a.days - b.days)
    .slice(0, 12);

  // === Phase 3+: Stalled Relationships — list (no activity >60d, Dormant excluded) ===
  const stalledRels = dashStalledList(state.relationships, todayDate, 60, state.interactions).slice(0, 12).map(r => {
    const co = state.companies.find(c => c.id === r.companyId);
    const ct = state.contacts.find(c => c.id === r.contactId);
    const days = r.lastInteractionDate ? Math.floor((todayDate - new Date(r.lastInteractionDate)) / 86400000) : null;
    return { r, co, ct, days };
  });

  // === Phase 3++: Tagged Action Items — relationships with [ACTION REQUIRED] prefix in nextAction ===
  // Catches the 4-rule audit (OVERDUE / NO OUTREACH / CHASE / STALE DEAL) and surfaces them prominently.
  const TAG_RANK = { 'OVERDUE':0, 'CHASE':1, 'STALE DEAL':2, 'NO OUTREACH':3 };
  const PRIO_RANK = { 'High':0, 'Medium':1, 'Low':2 };
  function _detectTag(s){
    if (!s) return null;
    if (s.indexOf('[ACTION REQUIRED - OVERDUE]') >= 0) return 'OVERDUE';
    if (s.indexOf('[ACTION REQUIRED - CHASE]') >= 0) return 'CHASE';
    if (s.indexOf('[ACTION REQUIRED - STALE DEAL]') >= 0) return 'STALE DEAL';
    if (s.indexOf('[ACTION REQUIRED - NO OUTREACH]') >= 0) return 'NO OUTREACH';
    return null;
  }
  const TAG_COLOR = { 'OVERDUE':'#a04330', 'CHASE':'#b04c32', 'STALE DEAL':'#8f6f48', 'NO OUTREACH':'#5a7d8c' };
  // STRICT DERIVE-ONLY: never fall back to stored prefix. Show ONLY what is currently action-required
  // based on real data (interactions + dates). Eliminates "stuck" stale tags.
  const _taggedAll = (state.relationships||[])
    .map(r => {
      if (r.status === 'Dormant') return null;
      const derived = dashDeriveAuditTags(r, state.interactions, todayDate);
      if (!derived) return null;
      const tag = derived.tag;
      const co = state.companies.find(c => c.id === r.companyId);
      if (!co) return null;
      const effLast = dashRelEffectiveLastDate(r, state.interactions);
      const days = effLast ? Math.floor((todayDate - effLast) / 86400000) : null;
      // Effective priority: OVERDUE auto-bumps to High live.
      const effPrio = (derived && derived.overdue) ? 'High' : (r.priority || 'Medium');
      return { r, co, tag, days, effPrio, derivedOverdue: derived ? derived.overdue : false };
    })
    .filter(Boolean)
    .sort((a, b) => (PRIO_RANK[a.effPrio]??9) - (PRIO_RANK[b.effPrio]??9) || (TAG_RANK[a.tag]??9) - (TAG_RANK[b.tag]??9));
  // Dedupe by company: keep the most urgent tag per company (already pre-sorted, so first wins).
  const _seenCo = new Set();
  const taggedRels = _taggedAll.filter(x => {
    if (_seenCo.has(x.co.id)) return false;
    _seenCo.add(x.co.id);
    return true;
  });
  const taggedByCat = { 'OVERDUE':0, 'CHASE':0, 'STALE DEAL':0, 'NO OUTREACH':0 };
  taggedRels.forEach(x => { taggedByCat[x.tag] = (taggedByCat[x.tag]||0) + 1; });
  const taggedHighPrio = taggedRels.filter(x => x.effPrio === 'High').length;

  // ============================================================
  // EXECUTION CENTER — derivations (self-healing, all live-computed)
  // ============================================================

  // §1 — Actions Required (strict)
  const ecOverdue = fInteractions.filter(i =>
    i.followUpDate && new Date(i.followUpDate) < todayDate && !i.completed && _notSuperseded(i)
  ).sort((a,b) => new Date(a.followUpDate) - new Date(b.followUpDate));

  const ecDueToday = dueToday;
  const ecDueWeek = dueWeek;

  const ecMissingNextAction = (state.relationships||[])
    .filter(r => r.status !== 'Dormant' && (!r.nextAction || !String(r.nextAction).trim()))
    .map(r => ({ r, co: state.companies.find(c => c.id === r.companyId) }))
    .filter(x => x.co);

  // §3 — My Next Moves (operational task list)
  const _prioRank = { High:0, Medium:1, Low:2 };
  const ecMyNextMoves = (state.relationships||[])
    .filter(r => r.status !== 'Dormant' && r.nextAction && String(r.nextAction).trim())
    .map(r => {
      const co = state.companies.find(c => c.id === r.companyId);
      if (!co) return null;
      const ct = state.contacts.find(c => c.id === r.contactId);
      const due = r.nextFollowUpDate ? new Date(r.nextFollowUpDate) : null;
      const overdue = due && due < todayDate;
      // Project: stored on rel, otherwise inferred from latest interaction
      let project = r.projectId ? state.projects.find(p => p.id === r.projectId) : null;
      if (!project) {
        const ixPids = state.interactions
          .filter(i => i.companyId === r.companyId && Array.isArray(i.projectIds))
          .flatMap(i => i.projectIds);
        const seen = {};
        ixPids.forEach(pid => { seen[pid] = (seen[pid]||0) + 1; });
        const topPid = Object.entries(seen).sort((a,b) => b[1]-a[1])[0];
        if (topPid) project = state.projects.find(p => p.id === topPid[0]);
      }
      return { r, co, ct, due, overdue, project };
    })
    .filter(Boolean)
    .sort((a,b) => {
      const pa = _prioRank[a.r.priority] ?? 9;
      const pb = _prioRank[b.r.priority] ?? 9;
      if (pa !== pb) return pa - pb;
      const da = a.due ? a.due.getTime() : Infinity;
      const db = b.due ? b.due.getTime() : Infinity;
      return da - db;
    });

  // §4 — Stalled (auto-detected from real conditions)
  const ecStalled = (state.relationships||[])
    .filter(r => r.status !== 'Dormant')
    .map(r => {
      const co = state.companies.find(c => c.id === r.companyId);
      if (!co) return null;
      const effLast = dashRelEffectiveLastDate(r, state.interactions);
      const days = effLast ? Math.floor((todayDate - effLast) / 86400000) : null;
      const overdue = r.nextFollowUpDate && new Date(r.nextFollowUpDate) < todayDate;
      const noAction = !r.nextAction || !String(r.nextAction).trim();
      const drifting = days !== null && days >= 30;
      if (!drifting && !overdue && !noAction) return null;
      const reasons = [];
      if (drifting) reasons.push(days + 'd silent');
      if (overdue) reasons.push('overdue ' + fmtDateShort(r.nextFollowUpDate));
      if (noAction) reasons.push('no next action');
      return { r, co, days, reason: reasons.join(' · ') };
    })
    .filter(Boolean)
    .sort((a,b) => (b.days||0) - (a.days||0))
    .slice(0, 12);

  // §5 — Hot (STRICT: recent + future action + project + momentum)
  const ecHot = (state.relationships||[])
    .filter(r => r.status !== 'Dormant')
    .map(r => {
      const co = state.companies.find(c => c.id === r.companyId);
      if (!co) return null;
      const effLast = dashRelEffectiveLastDate(r, state.interactions);
      if (!effLast) return null;
      const days = Math.floor((todayDate - effLast) / 86400000);
      if (days > 14) return null;
      if (!r.nextFollowUpDate) return null;
      if (new Date(r.nextFollowUpDate) < todayDate) return null;
      const coIx = state.interactions.filter(i => i.companyId === co.id);
      const allPids = coIx.flatMap(i => Array.isArray(i.projectIds) ? i.projectIds : []);
      if (allPids.length === 0) return null;
      const lastTwo = coIx.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0)).slice(0, 2);
      const hasMomentum = lastTwo.some(i => i.kpi === 'in_conversation' || i.kpi === 'action_required');
      if (!hasMomentum) return null;
      const projects = [...new Set(allPids)].map(pid => state.projects.find(p => p.id === pid)).filter(Boolean);
      return { r, co, days, projects };
    })

    .sort((a,b) => a.days - b.days)
    .slice(0, 10);

    const overdueN = linked.filter(i => i.followUpDate && new Date(i.followUpDate) < todayDate && !i.completed).length;

    const daysSince = latestDate ? Math.floor((todayDate - latestDate)/86400000) : null;
    const losing = daysSince !== null && daysSince > 14;
    if (overdueN === 0 && activeN === 0 && !losing) return null;
    const cos = [...new Set(linked.map(i => i.companyId))];
    return { p, overdueN, activeN, losing, daysSince, cosN: cos.length, ixN: linked.length };

          // Build last 12 weeks of activity (interactions per week)

          const dayOfWeek = todayDate.getDay() || 7; // Sunday=0 → 7
          const monday = new Date(todayDate); monday.setDate(monday.getDate() - dayOfWeek + 1);
          for (let w = 11; w >= 0; w--) {
            const start = new Date(monday); start.setDate(monday.getDate() - w*7);
            const end = new Date(start); end.setDate(start.getDate() + 7);
            const count = state.interactions.filter(i => {
              if (!i.date) return false;
              const d = new Date(i.date);
              return d >= start && d < end;
            }).length;
            weeks.push({ start, count });
          }
          const maxW = Math.max(1, ...weeks.map(w => w.count));
          const thisWeekCount = weeks[weeks.length-1].count;
          const lastWeekCount = weeks[weeks.length-2]?.count || 0;
          const delta = lastWeekCount ? Math.round(((thisWeekCount - lastWeekCount) / lastWeekCount) * 100) : null;
          return `<div class="card p-6">

              <div class="text-xs num" style="color: var(--warm);">

              ${weeks.map((w, idx) => {
                const h = Math.round((w.count / maxW) * 100);

                const color = isCurrent ? 'var(--green)' : 'var(--warm)';
                const opacity = isCurrent ? '1' : '0.55';
                return `<div class="flex-1 flex flex-col items-center justify-end" style="height:100%;" title="Week of ${fmtDateShort(w.start.toISOString())} — ${w.count} interactions">
                  <div class="w-full rounded-sm transition-all" style="height: ${Math.max(h, 4)}%; background: ${color}; opacity: ${opacity};"></div>
                </div>`;
              }).join('')}
            </div>
            <div class="flex justify-between mt-3 text-[10px] num" style="color: var(--warm);">
              <span>12w ago</span>
              <span>this week</span>
            </div>
          </div>`;
        })()}

      `}

function openCompanyDetail(id) {
  state.companyDetailId = id;
  // If we're not already on the companies view (e.g. clicking from Dashboard),
  // switch the visible view so the detail actually appears.
  if (state.currentView !== 'companies') {
    setView('companies');
  } else {
    renderCompanies();
  }
}
function closeCompanyDetail() {
  state.companyDetailId = null;
  renderCompanies();
}

function renderCompanyDetail(co) {
  const contacts = state.contacts.filter(c => c.companyId === co.id);
  const ints = state.interactions.filter(i => i.companyId === co.id).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
  const latest = ints[0];
  const pending = ints.filter(i => i.kpi === 'action_required' && !i.completed).length;
  const temp = getTemperature(co);
  const todayDate = new Date(); todayDate.setHours(0,0,0,0);
  const daysSinceLatest = latest ? Math.floor((todayDate - new Date(latest.date||0)) / (1000*60*60*24)) : null;

  // Latest touch summary — truncated to ~5 lines via CSS line-clamp
  document.getElementById('view-companies').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <button onclick="closeCompanyDetail()" class="text-xs uppercase tracking-wider font-semibold mb-4 inline-flex items-center gap-1.5 hover:opacity-70" style="color: var(--warm);">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back to companies
      </button>

      <!-- Header -->
      <div class="flex items-start justify-between mb-2">
        <div class="flex items-start gap-4">
          <div class="w-14 h-14 rounded-xl flex items-center justify-center text-white text-base font-semibold flex-shrink-0" style="background:${avatarColor(co.name)};">${getInitials(co.name)}</div>
          <div>
            <div class="text-[11px] uppercase tracking-widest font-semibold mb-1 flex items-center gap-2" style="color: var(--green);">
              <span>${typeLabel(co)}</span>
              ${co.subType ? `<span class="text-[10px] px-1.5 py-0.5 rounded" style="background:var(--paper);color:var(--warm);font-weight:600;">${esc(co.subType)}</span>` : ''}
            </div>
            <div class="flex items-center gap-3 flex-wrap">
              <h1 class="font-display text-4xl font-semibold tracking-tight">${esc(co.name)}</h1>
              ${pill(TEMP, temp)}

// Newsletter sync to Google Drive — POSTs Name/Company/Email to a Google Apps Script Web App
// that writes/updates a Google Sheet. URL is configured once via window.prompt (stored in
// localStorage). Shift-click the button to reset the URL.
async function syncNewsletterToDrive(ev){
  if (ev && ev.shiftKey) { localStorage.removeItem('boa-crm-drive-sync'); alert('Drive URL cleared. The next click will ask for the new URL.'); return; }
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem('boa-crm-drive-sync')||'null'); } catch(e){}
  if (!cfg || !cfg.webAppUrl) {
    const u = window.prompt('Paste your Google Apps Script Web App URL (ends with /exec):', '');
    if (!u) return;
    if (!u.includes('/exec')) { alert('That URL does not look like a Web App URL — it must end with /exec.\nGo back to Apps Script → Deploy → Web app, copy the URL and try again.'); return; }
    cfg = { webAppUrl: u.trim() };
    localStorage.setItem('boa-crm-drive-sync', JSON.stringify(cfg));
  }
  const rows = [['Name','Company','Email']];
  state.contacts.forEach(p => {
    if (!p.email || !p.email.trim()) return;
    const co = state.companies.find(c => c.id === p.companyId);
    const name = ((p.firstName||'') + ' ' + (p.lastName||'')).trim();
    rows.push([name, co?co.name:'', p.email.trim()]);
  });
  if (rows.length === 1) { alert('No contacts with email to sync.'); return; }
  const payload = JSON.stringify({ rows });
  // Apps Script returns a 302 redirect that often strips CORS headers — try cors first, fall back to no-cors
  // (the POST still reaches the script; we just can't read the response in that mode).
  try {
    const resp = await fetch(cfg.webAppUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: payload });
    const txt = await resp.text();
    let j = null; try { j = JSON.parse(txt); } catch(e){}
    if (j && j.ok) {
      const open = confirm(`Synced ${j.rows} contacts to Google Drive ✓\n\nOpen the Sheet now?`);
      if (open && j.url) window.open(j.url, '_blank');
      return;
    }
    alert('Sync sent but the response was unexpected:\n' + (txt || '(empty)') + '\n\nCheck the "BOA Newsletter Contacts" Sheet in your Drive to confirm.');
  } catch(err) {
    try {
      await fetch(cfg.webAppUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: payload, mode:'no-cors' });
      alert('Sync sent to Google Drive ✓\n\n(Browser blocked reading the response for CORS reasons, but the data WAS sent to Apps Script. Open the "BOA Newsletter Contacts" Sheet in your Drive to verify.)');
    } catch(err2) {
      alert('Sync error: ' + err2.message + '\n\nChecklist:\n• URL ends with /exec\n• Apps Script deployed as Web App with "Anyone" access\n• Opening the URL in a browser tab shows the plain-text endpoint message\n\nShift+click the button to reset the saved URL.');
    }
  }
}

// Newsletter export — downloads a CSV (Name / Company / Email) for every contact that has an email.
// CSV uses UTF-8 BOM + semicolon separator so Excel (PT/ES locale) opens it cleanly with accents.
function exportNewsletterCsv(){
  const rows = [['Name','Company','Email']];
  state.contacts.forEach(p => {
    if (!p.email || !p.email.trim()) return;
    const co = state.companies.find(c => c.id === p.companyId);
    const name = ((p.firstName||'') + ' ' + (p.lastName||'')).trim();
    rows.push([name, co?co.name:'', p.email.trim()]);
  });
  if (rows.length === 1) { alert('No contacts with email to export.'); return; }
  const csv = '﻿' + rows.map(r => r.map(v => {
    const s = String(v).replace(/"/g,'""');
    return /[;\n"\r]/.test(s) ? `"${s}"` : s;
  }).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `boa-newsletter-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function renderCompanies() {
  // Route to detail page if a company is selected
  if (state.companyDetailId) {
    const co = state.companies.find(x => x.id === state.companyDetailId);
