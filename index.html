    else { renderCompanyDetail(co); return; }
  }

  const f = state.companyFilter;
  const filtered = state.companies.filter(c => {
    if (f.search) {
      const s = f.search.toLowerCase();
      if (!(c.name||'').toLowerCase().includes(s) && !(c.country||'').toLowerCase().includes(s)) return false;
    }
    if (f.category && c.category !== f.category) return false;
    if (f.type && c.type !== f.type) return false;
    if (f.temp && getTemperature(c) !== f.temp) return false;
    if (f.projectId) {
      const directHas = Array.isArray(c.projectIds) && c.projectIds.includes(f.projectId);
      const cInts = state.interactions.filter(i => i.companyId === c.id);
      const intHas = cInts.some(i => Array.isArray(i.projectIds) && i.projectIds.includes(f.projectId));
      if (!directHas && !intHas) return false;
    }
    return true;
  });
  // Sort: Active first → Watching → Not Active; within each tier, by latest interaction
  // date (most recent first). Companies with no interactions fall to the bottom of their
  // status tier (alphabetical among themselves).
  const _lastTouchCache = new Map();
  const lastTouchTs = (c) => {
    if (_lastTouchCache.has(c.id)) return _lastTouchCache.get(c.id);
    const cInts = state.interactions.filter(i => i.companyId === c.id);
    let ts = 0;
    for (const i of cInts) {
      const t = i.date ? new Date(i.date).getTime() : 0;
      if (t > ts) ts = t;
    }
    _lastTouchCache.set(c.id, ts);
    return ts;
  };
  const STATUS_ORDER = { active: 0, watching: 1, inactive: 2 };
  // Within a status group, order by KPI priority (most actionable first), then by most recent interaction.
  const KPI_ORDER = { action_required:0, in_conversation:1, info_sent:2, monitoring:3, not_interested:4, closed:5, won:5 };
  const kpiRank = (c) => {
    // Use the SAME "latest KPI" shown in the table column (latest of all interactions) so the
    // on-screen order matches the visible KPI within each status group.
    const ints = state.interactions.filter(i => i.companyId === c.id);
    if (!ints.length) return 9;
    const latest = ints.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
    return KPI_ORDER[latest.kpi] ?? 8;
  };
  filtered.sort((a, b) => {
    const sa = STATUS_ORDER[getStatus(a)] ?? 3;
    const sb = STATUS_ORDER[getStatus(b)] ?? 3;
    if (sa !== sb) return sa - sb;
    const ka = kpiRank(a), kb = kpiRank(b);
    if (ka !== kb) return ka - kb;            // then by KPI priority
    const ta = lastTouchTs(a), tb = lastTouchTs(b);
    if (ta === 0 && tb === 0) return (a.name||'').localeCompare(b.name||'');
    if (ta === 0) return 1;
    if (tb === 0) return -1;
    return tb - ta;                            // then most recent interaction first
  });
  const cats = [...new Set(state.companies.map(c => c.category).filter(Boolean))].sort();

  document.getElementById('view-companies').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-end justify-between mb-8">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">Directory</div>
          <h1 class="font-display text-4xl font-semibold tracking-tight">Companies <span class="text-slate-300 num">${filtered.length}</span></h1>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="syncNewsletterToDrive(event)" class="ghost-btn px-4 py-2.5 text-sm rounded-lg font-semibold inline-flex items-center gap-2" title="Push Name / Company / Email of all contacts with email to your Google Drive (creates/updates a Sheet). Shift+click to change the URL.">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.9 5 5 0 019.9-1A5.5 5.5 0 0118.5 16h-1M12 12v9m-3-3l3 3 3-3"/></svg>
            Sync to Drive
          </button>
          <button onclick="openNewModal('company')" class="gold-btn px-4 py-2.5 text-sm rounded-lg font-semibold shadow-sm inline-flex items-center gap-2">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            New Company
          </button>
        </div>
      </div>

      <div class="card p-4 mb-4 flex flex-wrap gap-2">
        <div class="relative flex-1 min-w-64">
          <svg class="absolute left-3 top-2.5 text-slate-400" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="search-companies" type="text" placeholder="Search company…" value="${esc(f.search)}"
            oninput="state.companyFilter.search=this.value; render()"
            class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">

          <option value="">All categories</option>
          ${cats.map(c => `<option value="${esc(c)}" ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
        <select onchange="state.companyFilter.type=this.value; renderCompanies()" class="px-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">

// ============================================================
//  INTERACTIONS VIEW
// ============================================================
function renderInteractions() {
  const f = state.interactionFilter;
  const filtered = state.interactions.filter(i => {
    if (f.search) {
      const s = f.search.toLowerCase();
      if (!(i.subject||'').toLowerCase().includes(s) && !(i.summary||'').toLowerCase().includes(s)) return false;
    }
    if (f.kpi && i.kpi !== f.kpi) return false;
    if (f.companyId && i.companyId !== f.companyId) return false;
    if (f.projectId && !(Array.isArray(i.projectIds) && i.projectIds.includes(f.projectId))) return false;
    return true;
  });

  // Group by company
  const groups = new Map();
  for (const i of filtered) {
    const key = i.companyId || '__none__';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  // Sort interactions within each group by date desc, and sort groups by most recent interaction
  const groupList = [];
  for (const [companyId, items] of groups.entries()) {
    items.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    const latestDate = items[0]?.date || 0;
    groupList.push({ companyId, items, latestDate });
  }
  groupList.sort((a,b) => new Date(b.latestDate||0) - new Date(a.latestDate||0));

  document.getElementById('view-interactions').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-end justify-between mb-8">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">By Company</div>
          <h1 class="font-display text-4xl font-semibold tracking-tight">Interactions <span class="text-slate-300 num">${filtered.length}</span> <span class="text-sm font-normal" style="color: var(--warm);">· ${groupList.length} companies</span></h1>
        </div>
        <button onclick="openNewModal('interaction')" class="gold-btn px-4 py-2.5 text-sm rounded-lg font-semibold shadow-sm inline-flex items-center gap-2">

          New Interaction
        </button>
      </div>

      <div class="card p-4 mb-4 flex flex-wrap gap-2">
        <div class="relative flex-1 min-w-64">
          <svg class="absolute left-3 top-2.5 text-slate-400" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="search-interactions" type="text" placeholder="Search by subject or summary…" value="${esc(f.search)}"
            oninput="state.interactionFilter.search=this.value; render()"
            class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
        </div>
        <select onchange="state.interactionFilter.kpi=this.value; renderInteractions()" class="px-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
          <option value="">All KPIs</option>
          <option value="action_required" ${f.kpi==='action_required'?'selected':''}>Action Required</option>
          <option value="info_sent" ${f.kpi==='info_sent'?'selected':''}>Info Sent</option>
          <option value="in_conversation" ${f.kpi==='in_conversation'?'selected':''}>In Conversation</option>
          <option value="monitoring" ${f.kpi==='monitoring'?'selected':''}>Monitoring</option>
          <option value="not_interested" ${f.kpi==='not_interested'?'selected':''}>Not Interested</option>
        </select>
        <select onchange="state.interactionFilter.companyId=this.value; renderInteractions()" class="px-3 py-2 border rounded-lg text-sm max-w-xs" style="border-color: var(--line);">
          <option value="">All companies</option>
          ${state.companies.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c => `<option value="${esc(c.id)}" ${f.companyId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
        <select onchange="state.interactionFilter.projectId=this.value; renderInteractions()" class="px-3 py-2 border rounded-lg text-sm max-w-xs" style="border-color: var(--line);">
          <option value="">All projects</option>
          ${state.projects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p => `<option value="${esc(p.id)}" ${f.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>

      ${filtered.length === 0
        ? `<div class="card p-16 text-center text-slate-400">No interactions found</div>`
        : `<div class="space-y-4">
            ${groupList.map(g => {
              const co = state.companies.find(c => c.id === g.companyId);
              const coName = co ? co.name : '— No company —';
              const temp = co ? getTemperature(co) : null;
              const coCountry = co ? (co.country || '') : '';
              const coType = co ? (typeLabel(co)) : '';
              return `<div class="card overflow-hidden">
                <div class="px-5 py-4 flex items-center gap-3 border-b" style="border-color: var(--line-soft); background: var(--paper-soft);">

                      ${coCountry ? esc(coCountry) + ' · ' : ''}${coType ? esc(coType) + ' · ' : ''}${g.items.length} interaction${g.items.length>1?'s':''} · latest ${fmtDate(g.latestDate)}

                <div class="divide-y" style="--tw-divide-opacity:1;">
                  ${g.items.map(i => {

                            return `<select onchange="updateInteractionKpi('${esc(i.id)}', this.value)" class="pill-select" style="background-color:${kCol.bg}; color:${kCol.fg}; border:1px solid ${kCol.d}33;">

                              <option value="info_sent" ${i.kpi==='info_sent'?'selected':''}>Info Sent</option>
                              <option value="in_conversation" ${i.kpi==='in_conversation'?'selected':''}>In Conversation</option>
                              <option value="monitoring" ${i.kpi==='monitoring'?'selected':''}>Monitoring</option>
                              <option value="not_interested" ${i.kpi==='not_interested'?'selected':''}>Not Interested</option>
                            </select>`;
                          })()}
                          ${projectTags.map(p => `<span class="text-[10px] px-1.5 py-0.5 rounded font-medium" style="background: rgba(35,59,52,0.08); color: var(--green); border: 1px solid rgba(35,59,52,0.15);">${esc(p.name)}</span>`).join('')}

                        </div>
                        ${i.summary ? `<div class="text-sm text-slate-600 line-clamp-2">${esc(i.summary)}</div>` : ''}
                        <div class="text-xs text-slate-400 mt-1.5 flex items-center gap-3 flex-wrap">
                          ${ct ? `<span>${esc(ct.firstName+' '+ct.lastName)}</span>` : ''}
                          ${i.followUpDate ? `<span style="color: #7a5c3c;">↻ Follow-up on ${fmtDate(i.followUpDate)}</span>` : ''}
                        </div>
                      </div>
                      <div class="text-xs num text-right flex-shrink-0" style="color: var(--warm);">
                        <div style="color: var(--ink);">${fmtDateShort(i.date)}</div>
                        <div class="mt-0.5">${relTime(i.date)}</div>
                      </div>
                    </div>
                    ${expanded ? renderInlineEditForm('interaction', i, { title: i.subject || '—' }) : ''}`;
                  }).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>`}
    </div>
  `;
}

const PROJECT_STATUS = {
  active:     { label:'Active',     bg:'rgba(35,59,52,0.08)',   fg:'#233b34', d:'#233b34' },
  not_active: { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' },
  // Legacy aliases so old data still renders during migration
  on_hold:    { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' },
  won:        { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' },
  lost:       { label:'Not Active', bg:'rgba(172,164,151,0.18)',fg:'#6b6358', d:'#aca497' }
};

function projectStats(p) {
  const ints = state.interactions.filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(p.id));
  const companyIds = [...new Set(ints.map(i => i.companyId).filter(Boolean))];
  const latest = ints.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
  const pending = ints.filter(i => i.kpi === 'action_required' && !i.completed).length;
  return { interactions: ints, companyIds, latest, pending };
}

function fmtEUR(n) {
  if (n == null || n === '') return '—';
  if (n >= 1000000) return '€' + (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1000) return '€' + (n/1000).toFixed(0) + 'k';
  return '€' + n;
}

function openProjectDetail(id) {
  state.projectDetailId = id;
  renderProjects();
}
function closeProjectDetail() {
  state.projectDetailId = null;
  renderProjects();
}

function renderProjectDetail(p) {
  // Gather all interactions for this project
  const ints = state.interactions
    .filter(i => Array.isArray(i.projectIds) && i.projectIds.includes(p.id))
    .sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

  // Group by company
  const byCompany = new Map();
  for (const i of ints) {
    const key = i.companyId || '__none__';
    if (!byCompany.has(key)) byCompany.set(key, []);
    byCompany.get(key).push(i);
  }

  // Build company rows
  const companyRows = [];
  for (const [companyId, items] of byCompany.entries()) {
    const co = state.companies.find(c => c.id === companyId);
    const latest = items[0];
    companyRows.push({ co, companyId, latest, count: items.length });
  }
  companyRows.sort((a,b) => new Date(b.latest.date||0) - new Date(a.latest.date||0));

  // Action items (action_required + overdue follow-ups)
  const todayDate = new Date(); todayDate.setHours(0,0,0,0);
  const pending = ints.filter(i =>
    (i.kpi === 'action_required' && !i.completed) ||
    (i.followUpDate && new Date(i.followUpDate) < todayDate && !i.completed)
  );

  // Stats
  const latestDate = ints[0]?.date;
  const daysSinceLatest = latestDate ? Math.floor((todayDate - new Date(latestDate)) / (1000*60*60*24)) : null;
  const status = p.status || 'active';

  document.getElementById('view-projects').innerHTML = `

      <!-- Back -->

        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back to projects
      </button>

      <!-- Header -->
      <div class="flex items-start justify-between mb-2">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">Project</div>
          <div class="flex items-center gap-3 flex-wrap">
            <h1 class="font-display text-4xl font-semibold tracking-tight">${esc(p.name)}</h1>
            ${pill(PROJECT_STATUS, status)}
          </div>
          <div class="text-sm mt-2" style="color: var(--warm);">
            ${p.location ? esc(p.location) + ' · ' : ''}${p.type ? esc(p.type) + ' · ' : ''}${p.keys ? p.keys + ' keys · ' : ''}${fmtEUR(p.targetAmount)}
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="openEditInline('project','${esc(p.id)}')" class="ghost-btn px-4 py-2 text-sm rounded-lg font-medium">${isInlineEditing('project', p.id) ? 'Close edit' : 'Edit'}</button>
          <button onclick="openNewModal('interaction')" class="gold-btn px-4 py-2 text-sm rounded-lg font-semibold inline-flex items-center gap-2">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Log Interaction
          </button>
        </div>
      </div>

      ${isInlineEditing('project', p.id) ? `<div class="card overflow-hidden mt-4 mb-2" style="border-color: var(--line);">${renderInlineEditForm('project', p, { title: p.name })}</div>` : ''}

      <!-- Stats row -->
      <div class="grid grid-cols-4 gap-4 mb-6 mt-6">
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Companies</div>
          <div class="font-display text-3xl font-medium num">${companyRows.length}</div>
        </div>
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Interactions</div>
          <div class="font-display text-3xl font-medium num">${ints.length}</div>
        </div>
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Pending</div>
          <div class="font-display text-3xl font-medium num" style="color: ${pending.length > 0 ? '#a04330' : 'var(--ink)'};">${pending.length}</div>
        </div>
        <div class="stat-card">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Last activity</div>
          <div class="font-display text-xl font-medium">${latestDate ? fmtDate(latestDate) : '—'}</div>
          ${daysSinceLatest !== null ? `<div class="text-xs mt-1" style="color: var(--warm);">${daysSinceLatest}d ago</div>` : ''}
        </div>
      </div>

      <!-- Description / History -->
      ${p.description || p.history ? `
      <div class="card p-6 mb-6">
        ${p.description ? `<div class="mb-4">
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">Description</div>
          <div class="text-sm leading-relaxed" style="color: var(--ink);">${esc(p.description)}</div>
        </div>` : ''}
        ${p.history ? `<div>
          <div class="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style="color: var(--warm);">History</div>
          <div class="text-sm leading-relaxed" style="color: var(--ink); opacity: 0.85;">${esc(p.history)}</div>
        </div>` : ''}
      </div>
      ` : ''}

      <!-- Pending action items -->
      ${pending.length > 0 ? `
      <div class="card p-5 mb-6" style="border-left: 3px solid #b04c32;">
        <h2 class="font-display text-lg font-medium mb-3 flex items-center gap-2">
          <span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:#b04c32;"></span>
          Pending action items <span class="text-sm font-normal" style="color: var(--warm);">(${pending.length})</span>
        </h2>
        <div class="space-y-2">
          ${pending.map(i => {
            const co = state.companies.find(c => c.id === i.companyId);
            const isOverdue = i.followUpDate && new Date(i.followUpDate) < todayDate;
            return `<div class="flex items-start gap-3 py-2 px-2 -mx-2 rounded row-hover cursor-pointer" onclick="openEditModal('interaction','${esc(i.id)}')">
              <div class="w-8 h-8 rounded flex items-center justify-center text-white text-[10px] font-semibold flex-shrink-0" style="background:${avatarColor(co?co.name:'')};">${getInitials(co?co.name:'?')}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-medium text-sm" style="color: var(--ink);">${esc(co?co.name:'—')}</span>
                  <span class="text-xs" style="color: var(--warm);">·</span>
                  <span class="text-sm" style="color: var(--ink);">${esc(i.subject || '')}</span>
                </div>
                <div class="text-[11px] num mt-0.5" style="color: ${isOverdue ? '#a04330' : 'var(--warm)'};">
                  ${isOverdue ? '⚠ Overdue · was ' : 'Due '}${fmtDate(i.followUpDate || i.date)}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      ` : ''}

      <!-- Companies engaged -->
      <div class="card p-5 mb-6">
        <h2 class="font-display text-lg font-medium mb-3">Companies engaged <span class="text-sm font-normal" style="color: var(--warm);">(${companyRows.length})</span></h2>
        ${companyRows.length === 0
          ? `<div class="text-sm py-4 text-center" style="color: var(--warm);">No companies engaged yet on this project</div>`
          : `<div class="divide-y" style="border-color: var(--line-soft);">
              ${companyRows.map(({co, latest, count}) => {
                if (!co) return '';
                const temp = getTemperature(co);
                return `<div class="flex items-start gap-3 py-3 row-hover cursor-pointer px-2 -mx-2 rounded" onclick="event.stopPropagation();openEditModal('company','${esc(co.id)}')">
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center text-white text-xs font-semibold flex-shrink-0" style="background:${avatarColor(co.name)};">${getInitials(co.name)}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap mb-1">
                      <span class="font-semibold text-sm" style="color: var(--ink);">${esc(co.name)}</span>
                      ${pill(TEMP, temp)}
                      <span class="text-[10px] px-1.5 py-0.5 rounded" style="background: var(--paper); color: var(--warm);">${typeLabel(co)}</span>
                    </div>
                    <div class="text-xs truncate" style="color: var(--warm);">${esc(latest.subject || '')}</div>
                  </div>
                  <div class="text-right text-xs flex-shrink-0">
                    ${pill(KPI, latest.kpi)}
                    <div class="num mt-1" style="color: var(--warm);">${fmtDateShort(latest.date)} · ${count} int</div>
                  </div>
                </div>`;
              }).join('')}
            </div>`}
      </div>

      <!-- Timeline -->
      <div class="card p-5">
        <h2 class="font-display text-lg font-medium mb-3">Timeline <span class="text-sm font-normal" style="color: var(--warm);">(${ints.length})</span></h2>
        ${ints.length === 0
          ? `<div class="text-sm py-4 text-center" style="color: var(--warm);">No interactions logged for this project yet</div>`
          : `<div class="divide-y" style="border-color: var(--line-soft);">
              ${ints.map(i => {
                const co = state.companies.find(c => c.id === i.companyId);
                const ct = state.contacts.find(c => c.id === i.contactId);
                return `<div class="flex items-start gap-4 px-2 -mx-2 py-3 row-hover cursor-pointer rounded" onclick="openEditModal('interaction','${esc(i.id)}')">
                  <div class="text-right num text-xs flex-shrink-0" style="color: var(--warm); width: 70px;">
                    <div style="color: var(--ink); font-weight: 500;">${fmtDateShort(i.date)}</div>
                    <div class="mt-0.5">${relTime(i.date)}</div>
                  </div>
                  <div class="flex-1 min-w-0 border-l pl-4" style="border-color: var(--line-soft);">

      </div>
    </div>
  `;
}

function renderProjects() {
  // Route to detail page if a project is selected
  if (state.projectDetailId) {
    const p = state.projects.find(x => x.id === state.projectDetailId);
    if (!p) { state.projectDetailId = null; }
    else { renderProjectDetail(p); return; }
  }

  const f = state.projectFilter;
  const filtered = state.projects.filter(p => {
    if (f.search && !p.name.toLowerCase().includes(f.search.toLowerCase()) &&
        !(p.location||'').toLowerCase().includes(f.search.toLowerCase())) return false;
    if (f.status) {
      const ps = p.status || 'active';
      const normalized = (ps === 'on_hold' || ps === 'won' || ps === 'lost') ? 'not_active' : ps;
      if (normalized !== f.status) return false;
    }
    return true;
  });

  document.getElementById('view-projects').innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-end justify-between mb-8">
        <div>
          <div class="text-[11px] uppercase tracking-widest font-semibold mb-1" style="color: var(--green);">Pipeline</div>
          <h1 class="font-display text-4xl font-semibold tracking-tight">Projects <span class="text-slate-300 num">${filtered.length}</span></h1>
        </div>
        <button onclick="openNewModal('project')" class="gold-btn px-4 py-2.5 text-sm rounded-lg font-semibold shadow-sm inline-flex items-center gap-2">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          New Project
        </button>
      </div>

      <div class="card p-4 mb-4 flex flex-wrap gap-2">
        <div class="relative flex-1 min-w-64">
          <svg class="absolute left-3 top-2.5 text-slate-400" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
          <input id="search-projects" type="text" placeholder="Search project or location…" value="${esc(f.search)}"
            oninput="state.projectFilter.search=this.value; render()"
            class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
        </div>
        <select onchange="state.projectFilter.status=this.value; renderProjects()" class="px-3 py-2 border rounded-lg text-sm" style="border-color: var(--line);">
          <option value="">All statuses</option>
          <option value="active" ${f.status==='active'?'selected':''}>Active</option>
          <option value="not_active" ${f.status==='not_active'?'selected':''}>Not Active</option>
        </select>
      </div>

      ${filtered.length === 0
        ? `<div class="card p-16 text-center">
            <div class="text-slate-400 mb-4">No projects yet</div>
            <button onclick="openNewModal('project')" class="gold-btn px-4 py-2 text-sm rounded-lg font-semibold">Create your first project</button>
          </div>`
        : `<div class="grid grid-cols-2 gap-4">
            ${filtered.map(p => {
              const s = projectStats(p);
              const status = p.status || 'active';
              const expanded = isInlineEditing('project', p.id);
              return `<div class="card ${expanded ? 'col-span-2' : ''}">
                <div class="p-5 cursor-pointer transition-shadow hover:shadow-md ${expanded ? '' : ''}" onclick="openEditInline('project','${esc(p.id)}')" style="${expanded?'background: var(--paper-soft);':''}">
                  <div class="flex items-start justify-between mb-3">
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2 flex-wrap mb-1">
                        <svg class="flex-shrink-0" width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="color: var(--warm); transform: rotate(${expanded?90:0}deg); transition: transform 0.15s;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                        <h3 class="font-display text-xl font-medium" style="color: var(--ink);">${esc(p.name)}</h3>
                        ${(() => {
                          const pCol = PROJECT_STATUS[status] || PROJECT_STATUS.active;
                          return `<select onchange="event.stopPropagation();updateProjectField('${esc(p.id)}','status',this.value)" onclick="event.stopPropagation()" class="pill-select" style="background-color:${pCol.bg}; color:${pCol.fg}; border:1px solid ${pCol.d}33;">
                            <option value="active" ${status==='active'?'selected':''}>Active</option>
                            <option value="not_active" ${status==='not_active'?'selected':''}>Not Active</option>
                          </select>`;
                        })()}
                      </div>
                      <div class="text-xs" style="color: var(--warm);">
                        ${p.location ? esc(p.location) + ' · ' : ''}${p.type ? esc(p.type) + ' · ' : ''}${p.keys ? p.keys + ' keys · ' : ''}${fmtEUR(p.targetAmount)}
                      </div>
                    </div>
                    <button onclick="event.stopPropagation();openProjectDetail('${esc(p.id)}')"
                      class="text-xs px-2 py-1 rounded border hover:bg-gray-100" style="color: var(--warm); border-color: var(--line);">Open</button>
                  </div>
                  ${p.description ? `<div class="text-sm mb-3 line-clamp-2" style="color: var(--ink); opacity: 0.7;">${esc(p.description)}</div>` : ''}
                  <div class="flex items-center gap-4 text-xs pt-3 border-t" style="color: var(--warm); border-color: var(--line-soft);">

                    ${s.pending > 0 ? `<span style="color: #a04330;"><span class="num font-semibold">${s.pending}</span> pending</span>` : ''}

                  </div>
                </div>
                ${expanded ? renderInlineEditForm('project', p, { title: p.name }) : ''}
              </div>`;
            }).join('')}
          </div>`}
    </div>
  `;
}

const FIELDS = {
  company: [

function openEditInline(type, id) {
  if (READ_ONLY) return;
  if (state.editingType === type && state.editingId === id) {
    // Toggle off if already open
    state.editingType = null; state.editingId = null; state.isNew = false;
  } else {
    state.editingType = type; state.editingId = id; state.isNew = false;
  }
  render();
  setTimeout(() => {
    const el = document.querySelector('.inline-edit-drawer');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 30);
}
function closeEditInline() {
  state.editingType = null; state.editingId = null; state.isNew = false;
  render();
}
function isInlineEditing(type, id) {
  return state.editingType === type && state.editingId === id && !state.isNew;
}
// Render the inline edit form for a single item. Reuses fieldInput() so the

function fieldInput(f, item) {
  const val = item[f.key] != null ? item[f.key] : '';
  const base = `w-full px-3 py-2 border rounded-lg text-sm`;
  const borderStyle = `style="border-color: var(--line);"`;
  let input;

  const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
  if (f.type === 'textarea') {
    input = `<textarea id="f-${f.key}" rows="3" class="${base}" ${borderStyle}${ph}>${esc(val)}</textarea>`;
  } else if (f.type === 'select') {
    input = `<select id="f-${f.key}" class="${base}" ${borderStyle}>${f.options.map(o => `<option value="${esc(o.v)}" ${val===o.v?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
  } else if (f.type === 'company-select') {
    input = `<select id="f-${f.key}" onchange="refreshContactSelect()" class="${base}" ${borderStyle}>
      <option value="">— Select —</option>
      ${state.companies.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c => `<option value="${esc(c.id)}" ${val===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
    </select>`;
  } else if (f.type === 'contact-select') {
    const opts = contactsForCompany(item.companyId || '');
    input = `<select id="f-${f.key}" class="${base}" ${borderStyle}>
      <option value="">— Select —</option>
      ${opts.map(c => `<option value="${esc(c.id)}" ${val===c.id?'selected':''}>${esc(c.firstName+' '+c.lastName)}</option>`).join('')}
    </select>`;
  } else if (f.type === 'project-multi') {
    const selected = Array.isArray(val) ? val : (val ? [val] : []);
    const sorted = state.projects.slice().sort((a,b) => a.name.localeCompare(b.name));
    // For companies: also detect projects that arrive via this company's interactions
    // (the user can't uncheck those from the company-level field because they live on interactions)
    let viaInteractionsHtml = '';
    if (state.editingType === 'company' && item && item.id) {
      const intProjIds = state.interactions
        .filter(i => i.companyId === item.id && Array.isArray(i.projectIds))
        .flatMap(i => i.projectIds);
      const viaIntsOnly = [...new Set(intProjIds)].filter(pid => !selected.includes(pid));
      if (viaIntsOnly.length > 0) {
        viaInteractionsHtml = `
          <div class="mt-2 p-2 rounded" style="background: var(--paper-soft); border: 1px solid var(--line-soft);">
            <div class="text-[10px] uppercase tracking-wider font-semibold mb-1.5" style="color: var(--warm);">Also tagged via interactions</div>
            <div class="flex flex-wrap gap-1.5">
              ${viaIntsOnly.map(pid => {
                const p = state.projects.find(x => x.id === pid);
                if (!p) return '';
                return `<span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded" style="background: rgba(35,59,52,0.08); color: var(--green); border: 1px solid rgba(35,59,52,0.18);">
                  ${esc(p.name)}
                  <button type="button" onclick="detachProjectFromCompanyInteractions('${esc(item.id)}','${esc(pid)}')" title="Detach this project from all of this company's interactions" style="margin-left:2px; color: #a04330; font-weight: 700; line-height: 1; padding: 0 3px;">×</button>
                </span>`;
              }).join('')}
            </div>
            <div class="text-[10px] mt-1.5" style="color: var(--warm); opacity: 0.8;">These projects come from interactions. Clicking × removes the project tag from <em>all</em> interactions of this company.</div>
          </div>`;
      }
    }
    input = `<div id="f-${f.key}" class="border rounded-lg p-2 max-h-40 overflow-y-auto space-y-1" style="border-color: var(--line);">
      ${sorted.length === 0 ? `<div class="text-xs px-1 py-2" style="color: var(--warm);">No projects yet. Create one in the Projects view.</div>` :
        sorted.map(p => `<label class="flex items-center gap-2 px-1 py-0.5 cursor-pointer rounded hover:bg-slate-50">
          <input type="checkbox" value="${esc(p.id)}" ${selected.includes(p.id)?'checked':''} class="w-3.5 h-3.5 rounded accent-slate-900">
          <span class="text-sm">${esc(p.name)}</span>
          ${p.location ? `<span class="text-xs ml-auto" style="color: var(--warm);">${esc(p.location)}</span>` : ''}
        </label>`).join('')}
    </div>${viaInteractionsHtml}`;
  } else if (f.type === 'number') {
    input = `<input type="number" id="f-${f.key}" value="${esc(val)}" ${f.required?'required':''} class="${base}" ${borderStyle}>`;
  } else if (f.type === 'checkbox') {
    input = `<label class="flex items-center gap-2 cursor-pointer mt-2"><input type="checkbox" id="f-${f.key}" ${val?'checked':''} class="w-4 h-4 rounded accent-slate-900"><span class="text-sm text-slate-700">Yes</span></label>`;
  } else if (f.type === 'datetime-local') {
    const dtv = val ? (() => { try { return new Date(val).toISOString().slice(0,16); } catch(e){ return ''; } })() : '';
    input = `<input type="datetime-local" id="f-${f.key}" value="${esc(dtv)}" class="${base}" ${borderStyle}>`;
  } else if (f.type === 'date') {
    const dv = val ? (() => { try { return new Date(val).toISOString().slice(0,10); } catch(e){ return ''; } })() : '';
    input = `<input type="date" id="f-${f.key}" value="${esc(dv)}" class="${base}" ${borderStyle}>`;
  } else {
    input = `<input type="${f.type||'text'}" id="f-${f.key}" value="${esc(val)}" ${f.required?'required':''} class="${base}" ${borderStyle}>`;
  }

  return `<div>
    <label class="block text-[10px] uppercase tracking-[0.14em] font-semibold mb-1.5" style="color: var(--warm);">${esc(f.label)}${f.required?' <span style="color:#a04330;">*</span>':''}</label>
    ${input}
  </div>`;
}

function contactsForCompany(companyId) { return !companyId ? state.contacts : state.contacts.filter(c => c.companyId === companyId); }

function saveChanges() {
  const type = state.editingType; if (!type) return;
  const newData = {};
  for (const f of FIELDS[type]) {
    const el = document.getElementById('f-'+f.key); if (!el) continue;
    if (f.type === 'checkbox') newData[f.key] = el.checked;
    else if (f.type === 'datetime-local') newData[f.key] = el.value ? new Date(el.value).toISOString() : '';
    else if (f.type === 'date') newData[f.key] = el.value || '';
    else if (f.type === 'project-multi') {
      newData[f.key] = Array.from(el.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);
    }
    else if (f.type === 'number') newData[f.key] = el.value === '' ? null : Number(el.value);
    else newData[f.key] = el.value;
    if (f.required && !newData[f.key]) { alert('Field "'+f.label+'" is required.'); el.focus(); return; }
  }
  const arr = getArray(type);
  if (state.isNew) {
    // Interactions get the iu_NN prefix (matches the convention used by Claude-generated entries
    // and by the auto-sync. The legacy 'i' prefix would collide with i8-001, etc.).
    const prefix = { company:'co', contact:'p', interaction:'iu_', project:'pr' }[type];
    const maxNum = arr.reduce((m,x) => Math.max(m, parseInt((x.id||'').replace(/\D/g,''))||0), 0);
    newData.id = prefix + (maxNum + 1);
    newData.createdAt = new Date().toISOString();
    arr.push(newData);
    // INTERACTION ENGINE: auto-update relationships, projectIds, follow-up, supersede
    if (type === 'interaction') {
      try { postInteractionSave(newData); } catch(e) { console.warn('postInteractionSave error', e); }
    }
  } else {
    const idx = arr.findIndex(x => x.id === state.editingId); if (idx === -1) return;
    arr[idx] = { ...arr[idx], ...newData };
    // Re-run engine when editing an interaction (covers user setting followUpDate manually after creation)
    if (type === 'interaction') {
      try { postInteractionSave(arr[idx]); } catch(e) { console.warn('postInteractionSave error', e); }
    }
  }
  saveData(); closeModal(); render();
}

function deleteCurrentItem() {
  if (!confirm('Delete this record? This cannot be undone.')) return;
  const t = state.editingType, id = state.editingId;
  if (t==='company') state.companies = state.companies.filter(x => x.id !== id);
  else if (t==='contact') state.contacts = state.contacts.filter(x => x.id !== id);
  else if (t==='project') {
    state.projects = state.projects.filter(x => x.id !== id);
    // Remove project ref from interactions
    state.interactions.forEach(i => {
      if (Array.isArray(i.projectIds)) i.projectIds = i.projectIds.filter(pid => pid !== id);
    });
  }
  else state.interactions = state.interactions.filter(x => x.id !== id);
  saveData(); closeModal(); render();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  state.editingType = null; state.editingId = null; state.isNew = false;
}
function handleOverlayClick(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function getArray(type) {
  if (type==='company') return state.companies;
  if (type==='contact') return state.contacts;
  if (type==='project') return state.projects;
  return state.interactions;
}

//  INIT
// ============================================================
window.onload = async function() {
  state.currentView = 'dashboard';
  let dataLoaded = false;

  // Read-only shared snapshot (plain)
  if (SHARED_DATA) {
    state.companies = Array.isArray(SHARED_DATA.companies) ? SHARED_DATA.companies : [];
    state.contacts = Array.isArray(SHARED_DATA.contacts) ? SHARED_DATA.contacts : [];
    state.interactions = Array.isArray(SHARED_DATA.interactions) ? SHARED_DATA.interactions : [];
    state.projects = Array.isArray(SHARED_DATA.projects) ? SHARED_DATA.projects : [];
    state.meetings = Array.isArray(SHARED_DATA.meetings) ? SHARED_DATA.meetings : [];
    state.relationships = Array.isArray(SHARED_DATA.relationships) ? SHARED_DATA.relationships : [];
    state.lastUpdatedByClaudeCode = SHARED_DATA.lastUpdatedByClaudeCode || null;
    state.lastUpdatedByUser = SHARED_DATA.lastUpdatedByUser || null;
    document.body.classList.add('read-only');
    showReadOnlyBadge();
    setView('dashboard');
    updateButtons();
    return;
  }

  // Encrypted shared snapshot — show password gate
  if (ENCRYPTED_DATA) {
    document.body.classList.add('read-only');
    showPasswordGate();
    return;
  }

  // Try to reconnect to the previously linked file FIRST
  if (FS_SUPPORTED) {
    const savedHandle = await loadHandle();
    if (savedHandle) {
      try {
        const perm = await savedHandle.queryPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          fileHandle = savedHandle;
          fileName = savedHandle.name;
          // Read file directly without rendering yet
          try {
            const file = await fileHandle.getFile();
            const text = await file.text();
            const data = text.trim() ? JSON.parse(text) : {};
            state.companies = Array.isArray(data.companies) ? data.companies : [];
            state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
            state.interactions = Array.isArray(data.interactions) ? data.interactions : [];
            state.projects = Array.isArray(data.projects) ? data.projects : [];
            state.meetings = Array.isArray(data.meetings) ? data.meetings : [];
    state.relationships = Array.isArray(data.relationships) ? data.relationships : [];
            dataLoaded = true;
          } catch(e) { console.warn('initial file read failed', e); }
        } else {
          fileHandle = savedHandle;
          fileName = savedHandle.name;
          showReconnectBanner();
        }
      } catch(e) { console.warn('reconnect failed', e); }
    }
  }

  // Fallback: try localStorage
  if (!dataLoaded) loadFromStorage();

  // Now render — state is fully populated
  setView('dashboard');
  updateButtons();
  if (dataLoaded) updateStatus('synced');
};

function showPasswordGate() {
  // Hide the entire app
  document.querySelector('aside').style.display = 'none';
  document.querySelector('main').style.display = 'none';

  const gate = document.createElement('div');
  gate.id = 'password-gate';
  gate.className = 'fixed inset-0 flex items-center justify-center z-50 p-6';
  gate.style.cssText = 'background: var(--paper);';
  gate.innerHTML = `
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <svg width="58" height="78" viewBox="0 0 34 46" fill="none" class="mx-auto mb-5" aria-label="BOA Hotels monogram">
          <rect x="1.5" y="1.5" width="31" height="43" stroke="#233b34" stroke-width="0.9" fill="none"/>
          <text x="17" y="19" text-anchor="middle" font-family="Fraunces, 'PP Fragment Glare', serif" font-size="14" font-weight="400" fill="#233b34" style="font-variation-settings: 'opsz' 144;">B</text>
          <path d="M 5.5 25 Q 17 21 28.5 25" stroke="#233b34" stroke-width="0.9" fill="none" stroke-linecap="round"/>
          <text x="17" y="38" text-anchor="middle" font-family="Fraunces, 'PP Fragment Glare', serif" font-size="14" font-weight="400" fill="#233b34" style="font-variation-settings: 'opsz' 144;">H</text>
        </svg>
        <div class="font-display text-xl font-normal tracking-[0.18em] mb-2" style="color: var(--ink);">BOA HOTELS</div>
        <div class="text-[10px] uppercase tracking-[0.25em] font-semibold mb-5" style="color: var(--green);">CRM</div>
        <h1 class="font-display text-3xl font-medium mb-2" style="color: var(--ink);">Confidential view</h1>
        <p class="text-sm" style="color: var(--warm);">Enter the password you received to unlock the data.</p>
      </div>
      <form id="password-form" class="card p-6 space-y-4" onsubmit="return submitPassword(event)">
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold mb-2" style="color: var(--warm);">Password</label>
          <input id="password-input" type="password" autofocus autocomplete="off"
            class="w-full px-3 py-2.5 border rounded-lg text-sm font-mono" style="border-color: var(--line);">
        </div>
        <div id="password-error" class="hidden text-xs px-3 py-2 rounded-lg" style="background: rgba(176,76,50,0.08); color: #a04330;"></div>
        <button type="submit" id="password-submit" class="gold-btn w-full py-2.5 rounded-lg text-sm font-semibold">Unlock</button>
      </form>
      <p class="text-center text-xs mt-6" style="color: var(--warm);">Data is end-to-end encrypted with AES-256. Without the password it stays unreadable.</p>
    </div>`;
  document.body.appendChild(gate);

  // Try sessionStorage in case viewer already entered password this session
  const cached = sessionStorage.getItem('boa-crm-viewer-pw');
  if (cached) tryDecrypt(cached, true);
}

async function submitPassword(e) {
  e.preventDefault();
  const pw = document.getElementById('password-input').value;
  const errEl = document.getElementById('password-error');
  const btn = document.getElementById('password-submit');
  errEl.classList.add('hidden');
  btn.textContent = 'Unlocking…';
  btn.disabled = true;
  const ok = await tryDecrypt(pw, false);
  if (!ok) {
    errEl.textContent = 'Wrong password. Please try again.';
    errEl.classList.remove('hidden');
    btn.textContent = 'Unlock';
    btn.disabled = false;
    document.getElementById('password-input').select();
  }
  return false;
}

async function tryDecrypt(password, silent) {
  try {
    const data = await decryptPayload(ENCRYPTED_DATA, password);
    state.companies = Array.isArray(data.companies) ? data.companies : [];
    state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
    state.interactions = Array.isArray(data.interactions) ? data.interactions : [];
    state.projects = Array.isArray(data.projects) ? data.projects : [];
    state.meetings = Array.isArray(data.meetings) ? data.meetings : [];
    state.relationships = Array.isArray(data.relationships) ? data.relationships : [];
    state.lastUpdatedByClaudeCode = data.lastUpdatedByClaudeCode || null;
    state.lastUpdatedByUser = data.lastUpdatedByUser || null;
    sessionStorage.setItem('boa-crm-viewer-pw', password);
    // Reveal the app
    document.getElementById('password-gate')?.remove();
    document.querySelector('aside').style.display = '';
    document.querySelector('main').style.display = '';
    showReadOnlyBadge();
    setView('dashboard');
    updateButtons();
    return true;
  } catch(e) {
    if (silent) sessionStorage.removeItem('boa-crm-viewer-pw');
    return false;
  }
}

function showReadOnlyBadge() {
  const b = document.createElement('div');
  b.className = 'fixed top-3 right-3 z-30 px-3 py-1.5 rounded-full text-[11px] font-semibold uppercase tracking-wider';
  b.style.cssText = 'background: var(--ink); color: var(--paper); letter-spacing: 0.12em;';
  b.innerHTML = `<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--paper); margin-right:8px; vertical-align:middle;"></span>Read-only view`;
  document.body.appendChild(b);
}

function showReconnectBanner() {
  const b = document.createElement('div');
  b.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-lg shadow-lg z-30 flex items-center gap-3';
  b.style.cssText = 'background: var(--ink); color: var(--paper); border: 1px solid var(--green);';
  b.innerHTML = `<span class="text-sm">Reconnect to <strong>${esc(fileName)}</strong>?</span>
    <button onclick="requestReconnect(this.parentElement)" class="px-3 py-1.5 text-xs rounded font-semibold" style="background: var(--green); color: var(--paper);">Reconnect</button>
    <button onclick="this.parentElement.remove()" class="text-xs" style="color: rgba(226,223,214,0.5);">Dismiss</button>`;
  document.body.appendChild(b);
}

async function requestReconnect(banner) {
  try {
    const perm = await fileHandle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      await loadFromFile();
      updateButtons();
      banner.remove();
    } else {
      alert('Permission denied. Use "Connect file" to choose again.');
      fileHandle = null;
      banner.remove();
      updateButtons();
    }
  } catch(e) {
    console.error(e);
    fileHandle = null;
    banner.remove();
    updateButtons();
  }
}
